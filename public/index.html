<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州扑克</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --gold:#d4af37; --gold-light:#f3d97b;
  --felt1:#2f8f5e; --felt2:#17603d; --felt3:#0f3f28;
  --bg:#0c1f14; --panel:rgba(10,25,16,.94);
  --red:#d0192b; --ink:#f3ecd8;
  --line:rgba(212,175,55,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:radial-gradient(ellipse at 50% 20%, #143726, var(--bg) 70%);
  color:var(--ink); overflow:hidden;
}
.hidden{display:none !important}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

/* ============ 通用按钮 ============ */
.btn{border-radius:10px;font-weight:700;letter-spacing:1px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{padding:13px 18px;font-size:17px;width:100%}
.btn.small{padding:5px 12px;font-size:12px}
.btn.gold{background:linear-gradient(180deg,#f0cf6e,#c69a2c);color:#3a2c05;border:1px solid #8a6d1c;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
.btn.red{background:linear-gradient(180deg,#e05a4e,#b3202c);color:#fff;border:1px solid #7d1420}
.btn.red:hover:not(:disabled){filter:brightness(1.1)}
.btn.teal{background:linear-gradient(180deg,#3fae8f,#1f7f63);color:#fff;border:1px solid #14563f}
.btn.teal:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid rgba(243,236,216,.35);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:rgba(243,236,216,.7)}

/* ============ 大厅 ============ */
#lobby-screen{height:100vh;display:flex;align-items:center;justify-content:center}
.lobby-card,.room-card{
  background:linear-gradient(180deg,#123524,#0b2417);
  border:1px solid var(--line);border-radius:18px;padding:34px 30px;
  width:min(380px,92vw);display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.logo{font-size:27px;font-weight:900;letter-spacing:3px;color:var(--gold-light);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.logo .red{color:#ff5d6c}
.sub{font-size:13px;color:rgba(243,236,216,.6);margin-top:-6px}
.txt-input{
  background:rgba(0,0,0,.35);border:1px solid rgba(243,236,216,.25);color:var(--ink);
  border-radius:10px;padding:11px 12px;font-size:15px;width:100%;text-align:center;outline:none;
}
.txt-input:focus{border-color:var(--gold)}
.divider{width:100%;display:flex;align-items:center;gap:10px;color:rgba(243,236,216,.5);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(243,236,216,.18)}
.join-row{display:flex;gap:10px;width:100%}
.join-row .txt-input{text-transform:uppercase;letter-spacing:4px;font-weight:700}
.join-row .btn{flex-shrink:0;padding:11px 22px}

/* ============ 等待室 ============ */
#room-screen{height:100vh;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;color:rgba(243,236,216,.55)}
.room-id{
  font-size:42px;font-weight:900;letter-spacing:12px;
  color:var(--gold-light);cursor:pointer;padding-left:12px;text-shadow:0 2px 10px rgba(0,0,0,.5);
}
#room-players{width:100%;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.pl{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border:1px solid rgba(243,236,216,.15);border-radius:10px;font-size:14px}
.pl .nm{font-weight:700}
.pl .cips{color:var(--gold-light)}
.pl .me-tag{font-size:11px;color:rgba(243,236,216,.55);margin-left:6px}
.pl .crown{margin-right:4px}
#room-actions{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}

/* ============ 游戏屏 ============ */
#game-screen{display:flex;flex-direction:column;height:100vh}
#game-screen > header{
  display:flex;align-items:center;gap:16px;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;flex-shrink:0;
}
#game-screen > header b{color:var(--gold-light);letter-spacing:2px}
#game-screen > header .sp{flex:1}
#g-phase{padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-weight:700}

#table-wrap{flex:1;position:relative;min-height:280px}
#table{position:absolute;inset:9% 6%}
#table::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2) 55%,var(--felt3));
  border:10px solid #6b4a2a;
  box-shadow:inset 0 0 70px rgba(0,0,0,.55),0 12px 45px rgba(0,0,0,.5);
}
#table::after{
  content:'';position:absolute;inset:16px;border-radius:50%;
  border:2px solid rgba(212,175,55,.4);pointer-events:none;
}
#community{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:1}
#pot{color:var(--gold-light);font-weight:800;font-size:16px;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#board{display:flex;gap:8px;justify-content:center}

/* ============ 扑克牌 ============ */
.card{
  background:linear-gradient(160deg,#fff,#eceada);border:1px solid #cfc9b4;border-radius:8%;
  box-shadow:0 2px 6px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;flex-shrink:0;user-select:none;
}
.card .r{line-height:1.05}
.card .s{line-height:1}
.card.red{color:#c8102e}.card.blk{color:#1b1b1b}
.card.back{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 5px,transparent 5px 10px),#274c9e;
  border-color:#16295e;
}
.c-lg{width:64px;height:90px;font-size:22px}
.c-md{width:54px;height:76px;font-size:18px}
.c-sm{width:31px;height:44px;font-size:10px}
.c-xs{width:26px;height:37px;font-size:9px}
.slot{border:2px dashed rgba(243,236,216,.22);border-radius:8%;flex-shrink:0}
.slot.md{width:54px;height:76px}
@keyframes dealIn{from{transform:translateY(-16px) rotate(-8deg) scale(.55);opacity:0}to{transform:none;opacity:1}}
.card.deal{animation:dealIn .38s ease-out}

/* ============ 座位 ============ */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column-reverse;
  align-items:center;gap:5px;z-index:2;width:max-content}
.seat.top{flex-direction:column}
.hole{display:flex}
.hole .card{border-radius:10%}
.hole .card:last-child{margin-left:-10px}
.plaque{
  min-width:100px;max-width:140px;padding:6px 12px;text-align:center;
  background:var(--panel);border:1px solid rgba(212,175,55,.45);border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.p-name{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;overflow:hidden;max-width:130px}
.p-chips{color:var(--gold-light);font-size:12px;margin-top:1px}
.seat.current .plaque{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(212,175,55,.55),0 0 20px rgba(212,175,55,.55);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(212,175,55,.85),0 0 30px rgba(212,175,55,.8)}}
.seat.folded{opacity:.45;filter:saturate(.35)}
.tag{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:800;flex-shrink:0}
.tag.allin{background:#b3202c;color:#fff}
.tag.disc{background:#666;color:#ddd}
.tag.dealer{background:var(--gold);color:#3a2c05}
.bubble{
  position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.72);border:1px solid rgba(243,236,216,.25);
  padding:2px 9px;border-radius:10px;font-size:11px;white-space:nowrap;
}
.seat.top .bubble{bottom:auto;top:calc(100% + 4px)}
.bet{
  position:absolute;transform:translate(-50%,-50%);z-index:1;
  background:radial-gradient(circle at 35% 30%,#f6d97c,#caa030 60%,#9a7417);
  color:#3a2c05;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px dashed rgba(58,44,5,.6);box-shadow:0 2px 5px rgba(0,0,0,.4);white-space:nowrap;
}

/* ============ 底部行动区 ============ */
#bottom-bar{
  display:flex;align-items:center;gap:20px;padding:13px 18px;flex-shrink:0;
  background:var(--panel);border-top:1px solid var(--line);
  min-height:118px;flex-wrap:wrap;
}
#bottom-bar.my-turn{box-shadow:inset 0 0 0 2px rgba(212,175,55,.5)}
#my-cards{display:flex}
#my-cards .card:last-child{margin-left:-12px;transform:rotate(6deg)}
#me-info{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:90px}
#me-info .nm{font-weight:800;font-size:15px}
#me-info .cips{color:var(--gold-light);font-weight:700}
#action-bar{flex:1;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
#turn-status{font-size:13px;color:#cfe6d6}
#turn-status.my{color:var(--gold-light);font-weight:800;font-size:15px}
#actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#actions .btn{padding:11px 20px;font-size:15px}
#raise-box{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);
  border:1px solid rgba(243,236,216,.2);border-radius:12px;padding:8px 12px}
#raise-slider{width:150px;accent-color:var(--gold)}
#raise-val{font-weight:800;color:var(--gold-light);min-width:66px;text-align:center;font-size:14px}
#quick-row{display:flex;gap:6px}
#quick-row .btn{padding:5px 10px;font-size:12px;white-space:nowrap;background:rgba(243,236,216,.08);
  border:1px solid rgba(243,236,216,.3);color:var(--ink)}
#quick-row .btn:hover{border-color:var(--gold)}

/* ============ 摊牌弹层 ============ */
#showdown{position:fixed;inset:0;background:rgba(4,12,8,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50}
#showdown .panel{
  background:linear-gradient(180deg,#123524,#0b2417);border:2px solid var(--gold);
  border-radius:16px;padding:24px 28px;min-width:320px;max-width:92vw;max-height:84vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
#showdown h2{font-size:19px;color:var(--gold-light);letter-spacing:2px}
.winner-row{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;
  border-bottom:1px dashed rgba(243,236,216,.2);padding-bottom:12px}
.winner-row:last-of-type{border-bottom:none}
.winner-row .who{font-weight:800;font-size:15px}
.winner-row .who .desc{color:var(--gold-light);margin-left:8px}
.winner-row .cards{display:flex;gap:5px}

/* ============ 提示与遮罩 ============ */
#toast-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(18,18,18,.92);border:1px solid var(--line);color:var(--ink);
  padding:9px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:dealIn .25s ease-out}
#conn-lost{position:fixed;inset:0;background:rgba(4,12,8,.88);z-index:100;
  display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-size:17px}

/* ============ 新增：计时 / 状态标签 / 重连 ============ */
.room-id{display:block}
.tag.out{background:#555;color:#eee}
.tag.wait{background:#2d5d8a;color:#e6f1ff}
.tag.host{background:transparent;padding:0}
.p-timer{height:3px;border-radius:2px;background:rgba(243,236,216,.15);margin-top:4px;overflow:hidden}
.p-timer > i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.p-timer.low > i{background:#e05a4e}
.hole.shown .card{border-radius:8%}
.hole.shown .card:last-child{margin-left:2px}
.card.hl{box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(0,0,0,.45)}
.card.dim{opacity:.4}
#banner{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:7px 12px;background:rgba(45,93,138,.35);border-bottom:1px solid rgba(243,236,216,.15);font-size:13px}
#banner:empty{display:none}
#banner .btn{padding:5px 14px;font-size:12px}
#reconnecting{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:98;
  background:rgba(18,18,18,.92);border:1px solid var(--line);padding:9px 18px;border-radius:10px;font-size:14px}
#room-extra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pl .tagbox{display:flex;gap:5px;align-items:center}
.pot-row{font-size:13px;color:rgba(243,236,216,.75);text-align:center}
.pot-row b{color:var(--gold-light)}
#sd-hands{width:100%;display:flex;flex-direction:column;gap:10px}
.sd-hand{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px dashed rgba(243,236,216,.2);padding-bottom:10px}
.sd-hand:last-child{border-bottom:none}
.sd-hand .who{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:2px}
.sd-hand .who .desc{color:var(--gold-light);font-weight:600;font-size:12px}
.sd-hand .who .won{color:#7fe0b0;font-size:12px}
.sd-hand .cards{display:flex;gap:4px;align-items:center}
.sd-hand .cards .gap{width:8px}
#sd-foot{display:flex;flex-direction:column;gap:8px;align-items:center}
#sd-count{font-size:12px;color:rgba(243,236,216,.6)}
#sd-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ============ 窄屏适配 ============ */
@media (max-width:720px){
  .c-lg{width:52px;height:74px;font-size:18px}
  .c-md{width:44px;height:62px;font-size:15px}
  .c-sm{width:26px;height:37px;font-size:8px}
  .slot.md{width:44px;height:62px}
  .plaque{min-width:80px;padding:5px 8px}
  .p-name{font-size:11px;max-width:96px}
  .p-chips{font-size:10px}
  #bottom-bar{gap:10px;padding:10px}
  #actions .btn{padding:9px 14px;font-size:13px}
  #raise-slider{width:auto;flex:1;min-width:110px}
  #action-bar{flex-basis:100%;align-items:stretch;gap:7px}
  #turn-status{text-align:center}
  #actions{justify-content:center;gap:8px}
  #raise-box{flex-wrap:wrap;justify-content:center;width:100%;padding:8px;gap:8px}
  #quick-row{order:3;width:100%;justify-content:center}
  #raise-box .btn.gold{order:4;width:100%}
  #banner{font-size:12px}
  .room-id{font-size:34px;letter-spacing:8px}
  #game-screen > header{gap:8px;font-size:11px;flex-wrap:wrap}
}
</style>
</head>
<body>

<div id="toast-box"></div>

<!-- 大厅 -->
<div id="lobby-screen">
  <div class="lobby-card">
    <div class="logo"><span class="red">♥</span>♠ 德州扑克 ♦<span class="red">♣</span></div>
    <p class="sub">与好友在线对战 · 房间制多人德州</p>
    <input id="name-input" class="txt-input" maxlength="12" placeholder="输入你的昵称">
    <button id="btn-create" class="btn gold big">创建房间</button>
    <div class="divider">或加入好友房间</div>
    <div class="join-row">
      <input id="room-input" class="txt-input" maxlength="6" placeholder="房间号">
      <button id="btn-join" class="btn teal">加入</button>
    </div>
  </div>
</div>

<!-- 等待室 -->
<div id="room-screen" class="hidden">
  <div class="room-card">
    <p class="hint">房间号 · 点击复制邀请链接发给好友</p>
    <div id="room-id" class="room-id" title="点击复制邀请链接">------</div>
    <div id="room-players"></div>
    <div id="room-actions">
      <div id="room-extra"></div>
      <button id="btn-start" class="btn gold big hidden">开始游戏</button>
      <p id="room-hint" class="hint"></p>
      <button id="btn-leave-waiting" class="btn ghost small">离开房间</button>
    </div>
  </div>
</div>

<!-- 游戏屏 -->
<div id="game-screen" class="hidden">
  <header>
    <span>房间 <b id="g-room" title="点击复制邀请链接" style="cursor:pointer">------</b></span>
    <span>盲注 <b id="g-blind">50/100</b></span>
    <span id="g-hand"></span>
    <span class="sp"></span>
    <span id="g-phase">等待</span>
    <button id="btn-leave-game" class="btn ghost small">离开牌桌</button>
  </header>
  <div id="banner"></div>

  <div id="table-wrap">
    <div id="table">
      <div id="community">
        <div id="pot"></div>
        <div id="board"></div>
      </div>
    </div>
  </div>

  <div id="bottom-bar">
    <div id="my-cards"></div>
    <div id="me-info"></div>
    <div id="action-bar">
      <div id="turn-status"></div>
      <div id="actions"></div>
    </div>
  </div>
</div>

<!-- 结算弹层 -->
<div id="showdown" class="hidden">
  <div class="panel">
    <h2 id="sd-title">摊牌</h2>
    <div id="sd-pots"></div>
    <div id="sd-hands"></div>
    <div id="sd-foot">
      <div id="sd-count"></div>
      <div id="sd-btns"></div>
    </div>
  </div>
</div>

<!-- 重连提示 -->
<div id="reconnecting" class="hidden">⏳ 网络断开，正在重新连接…</div>

<!-- 无法恢复时的遮罩 -->
<div id="conn-lost" class="hidden">
  <div id="conn-lost-msg">⚠ 与服务器的连接已断开</div>
  <button onclick="location.reload()" class="btn gold" style="padding:11px 30px">重新进入</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 常量 ---------- */
const PHASE_NAME = {waiting:'等待中',preflop:'翻牌前',flop:'翻牌圈',turn:'转牌圈',river:'河牌圈',showdown:'结算'};
const ACTION_NAME = {fold:'弃牌',check:'过牌',call:'跟注',raise:'加注','all-in':'全下'};
const RED_SUITS = new Set(['♥','♦']);
const SESSION_KEY = 'poker-session';

/* ---------- 状态 ---------- */
// 服务器用令牌认人：刷新页面或断线重连后凭令牌回到原座位
const socket = io({ reconnectionDelay: 800, reconnectionDelayMax: 4000 });
let state = null;          // 最近一次 gameState
let clockOffset = 0;       // 服务器时间 - 本地时间
let prevBoardLen = 0;      // 公共牌动画：只动画新翻的牌
let prevHandNo = 0;        // 换局时重新动画自己的手牌
let lastRaiseTo = null;    // 记住滑杆位置，重渲染时不重置
let lastTurnKey = '';      // 轮次标识，换人/换局则重置滑杆
let sdHiddenFor = 0;       // 本局结算弹层被手动关闭

function loadSession(){
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)) || null; } catch { return null; }
}
function saveSession(s){
  try { s ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)) : sessionStorage.removeItem(SESSION_KEY); } catch {}
}

/* ---------- 工具 ---------- */
function toast(msg, ms = 2600){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  $('toast-box').appendChild(d);
  setTimeout(() => d.remove(), ms);
}
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getName(){
  const v = $('name-input').value.trim();
  if (!v){ toast('请先输入昵称'); $('name-input').focus(); return null; }
  try { localStorage.setItem('poker-name', v); } catch {}
  return v;
}
function showScreen(id){
  ['lobby-screen','room-screen','game-screen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
function cardEl(card, size, animate){
  if (!card) return backEl(size);
  const el = document.createElement('div');
  el.className = `card ${size} ${RED_SUITS.has(card.suit) ? 'red' : 'blk'}` + (animate ? ' deal' : '');
  el.innerHTML = `<span class="r">${card.rank}</span><span class="s">${card.suit}</span>`;
  return el;
}
function backEl(size){
  const el = document.createElement('div');
  el.className = `card back ${size}`;
  return el;
}
const sameCard = (a, b) => a && b && a.rank === b.rank && a.suit === b.suit;
function serverNow(){ return Date.now() + clockOffset; }
function inviteLink(){
  return `${location.origin}${location.pathname}?room=${state ? state.roomId : ''}`;
}
function copyInvite(){
  if (!state) return;
  const link = inviteLink();
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .then(() => toast('邀请链接已复制，发给好友即可加入'), () => toast('房间号: ' + state.roomId));
}
function send(ev, data){
  return new Promise(resolve => socket.emit(ev, data || {}, res => {
    if (res && !res.success && res.error) toast(res.error);
    resolve(res || {});
  }));
}
function iAmController(){
  if (!state) return false;
  const host = state.players.find(p => p.id === state.hostId);
  return state.myId === state.hostId || !host || !host.connected;
}
const me = () => state && state.players[state.myIndex];

/* ---------- 大厅 ---------- */
try { $('name-input').value = localStorage.getItem('poker-name') || ''; } catch {}
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('room-input').value = urlRoom.toUpperCase();

$('btn-create').onclick = async () => {
  const name = getName(); if (!name) return;
  const res = await send('createRoom', { name, bigBlind: 100 });
  if (res.success) saveSession({ roomId: res.roomId, token: res.token });
};
$('btn-join').onclick = joinRoom;
$('room-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
$('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') (urlRoom ? joinRoom() : $('btn-create').click()); });
async function joinRoom(){
  const name = getName(); if (!name) return;
  const roomId = $('room-input').value.trim().toUpperCase();
  if (!roomId) return toast('请输入房间号');
  const res = await send('joinRoom', { roomId, name });
  if (res.success) saveSession({ roomId: res.roomId, token: res.token });
}
async function leave(){
  await send('leaveRoom');
  saveSession(null);
  state = null;
  history.replaceState(null, '', location.pathname);
  $('showdown').classList.add('hidden');
  showScreen('lobby-screen');
}

/* ---------- 等待室 ---------- */
function renderRoom(){
  const s = state;
  $('room-id').textContent = s.roomId;
  const box = $('room-players'); box.innerHTML = '';
  s.players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'pl';
    let tags = '';
    if (!p.connected) tags += '<span class="tag disc">断线</span>';
    else if (p.sittingOut) tags += '<span class="tag out">暂离</span>';
    row.innerHTML =
      `<span class="nm">${p.id === s.hostId ? '<span class="crown">👑</span>' : ''}${escapeHtml(p.name)}` +
      `${i === s.myIndex ? '<span class="me-tag">(你)</span>' : ''}</span>` +
      `<span class="tagbox">${tags}<span class="cips">筹码 ${fmt(p.chips)}</span></span>`;
    box.appendChild(row);
  });

  const extra = $('room-extra'); extra.innerHTML = '';
  const m = me();
  if (m && m.chips === 0) extra.appendChild(button(`补充筹码 ${fmt(s.startingChips)}`, 'teal', () => send('rebuy')));
  if (m && m.sittingOut) extra.appendChild(button('回到座位', 'teal', () => send('sitIn')));

  const ready = s.players.filter(p => p.connected && !p.sittingOut && p.chips > 0).length;
  const ctrl = iAmController();
  $('btn-start').classList.toggle('hidden', !ctrl);
  $('btn-start').textContent = s.handNumber > 0 ? '继续游戏' : '开始游戏';
  $('btn-start').disabled = ready < 2;
  $('room-hint').textContent = !ctrl ? '等待房主开始游戏…'
    : ready < 2 ? '等待更多玩家加入（至少 2 名有筹码的玩家）' : '人齐了，可以开局！';
}
function button(text, color, onclick){
  const b = document.createElement('button');
  b.className = `btn ${color}`; b.style.padding = '9px 18px';
  b.textContent = text; b.onclick = onclick;
  return b;
}
$('room-id').onclick = copyInvite;
$('g-room').onclick = copyInvite;
$('btn-start').onclick = () => send('startGame');
$('btn-leave-waiting').onclick = leave;
$('btn-leave-game').onclick = () => {
  const m = me();
  const inHand = m && m.inHand && !m.folded && state.phase !== 'showdown' && state.phase !== 'waiting';
  if (!confirm(inHand ? '牌局进行中离开将自动弃牌，确定离开？' : '确定离开牌桌？')) return;
  leave();
};

/* ---------- 状态接收 ---------- */
socket.on('gameState', s => {
  const prev = state;
  state = s;
  clockOffset = s.serverNow - Date.now();
  if (s.phase === 'waiting'){
    $('showdown').classList.add('hidden');
    renderRoom();
    showScreen('room-screen');
  } else {
    if (prev && prev.phase === 'waiting') prevBoardLen = 0;
    showScreen('game-screen');
    renderGame();
  }
});

/* ---------- 游戏渲染 ---------- */
function seatPos(i, n){
  // 让"我"始终坐在正下方，其余玩家绕椭圆排布（旁观时以 0 号为基准）
  const base = state.myIndex >= 0 ? state.myIndex : 0;
  const a = (90 + (i - base) * (360 / n)) * Math.PI / 180;
  return { x: 50 + 46 * Math.cos(a), y: 50 + 42 * Math.sin(a), top: Math.sin(a) < -0.05 };
}

const live = s => ['preflop','flop','turn','river'].includes(s.phase);

function renderGame(){
  const s = state, n = s.players.length;
  $('g-room').textContent = s.roomId;
  $('g-blind').textContent = `${s.smallBlind}/${s.bigBlind}`;
  $('g-hand').textContent = s.handNumber > 0 ? `第 ${s.handNumber} 局` : '';
  $('g-phase').textContent = PHASE_NAME[s.phase] || s.phase;

  const wrap = $('table-wrap');
  wrap.querySelectorAll('.seat,.bet').forEach(e => e.remove());
  const frag = document.createDocumentFragment();

  s.players.forEach((p, i) => {
    const pos = seatPos(i, n);
    const seat = document.createElement('div');
    const isCur = i === s.currentPlayerIndex && live(s);
    seat.className = 'seat' + (pos.top ? ' top' : '') +
      (p.folded || !p.inHand ? ' folded' : '') + (isCur ? ' current' : '');
    seat.style.left = pos.x + '%';
    seat.style.top = pos.y + '%';

    const plaque = document.createElement('div');
    plaque.className = 'plaque';
    let tags = '';
    if (i === s.dealerIndex) tags += '<span class="tag dealer">D</span>';
    if (p.allIn) tags += '<span class="tag allin">全下</span>';
    if (!p.connected) tags += '<span class="tag disc">断线</span>';
    else if (p.sittingOut) tags += '<span class="tag out">暂离</span>';
    if (!p.inHand && live(s)) tags += '<span class="tag wait">下局</span>';
    plaque.innerHTML =
      `<div class="p-name">${p.id === s.hostId ? '👑' : ''}${escapeHtml(p.name)}${i === s.myIndex ? ' <span style="opacity:.5;font-size:10px">(你)</span>' : ''}${tags}</div>` +
      `<div class="p-chips">筹码 ${fmt(p.chips)}</div>` +
      (isCur && s.turnDeadline ? '<div class="p-timer" data-timer><i></i></div>' : '');
    seat.appendChild(plaque);

    // 本街动作气泡
    if (p.lastAction && live(s)){
      const b = document.createElement('div');
      b.className = 'bubble'; b.textContent = ACTION_NAME[p.lastAction] || p.lastAction;
      seat.appendChild(b);
    }

    // 别人的手牌：牌背；摊牌时亮出
    if (i !== s.myIndex && p.hand.length && (!p.folded || s.phase === 'showdown')){
      const shown = p.hand.some(Boolean);
      if (!p.folded || shown){
        const hole = document.createElement('div');
        hole.className = 'hole' + (shown ? ' shown' : '');
        p.hand.forEach(c => hole.appendChild(cardEl(c, 'c-sm')));
        seat.appendChild(hole);
      }
    }
    frag.appendChild(seat);

    // 当前下注筹码，摆在座位与桌心之间
    if (p.bet > 0){
      const bet = document.createElement('div');
      bet.className = 'bet'; bet.textContent = fmt(p.bet);
      bet.style.left = (pos.x + (50 - pos.x) * 0.34) + '%';
      bet.style.top = (pos.y + (50 - pos.y) * 0.30) + '%';
      frag.appendChild(bet);
    }
  });
  wrap.appendChild(frag);

  // 公共牌 + 底池
  const board = $('board'); board.innerHTML = '';
  const cards = s.communityCards || [];
  for (let i = 0; i < 5; i++){
    if (i < cards.length){
      const animate = cards.length > prevBoardLen && i >= prevBoardLen;
      board.appendChild(cardEl(cards[i], 'c-md', animate));
    } else {
      const slot = document.createElement('div');
      slot.className = 'slot md';
      board.appendChild(slot);
    }
  }
  prevBoardLen = cards.length;
  $('pot').textContent = s.pot > 0 ? `底池 ${fmt(s.pot)}` : '';

  // 我的手牌（换局时重新发牌动画）
  const m = me();
  const mc = $('my-cards'); mc.innerHTML = '';
  if (m && m.hand && m.hand.length){
    const newHand = s.handNumber !== prevHandNo;
    m.hand.forEach(c => mc.appendChild(cardEl(c, 'c-lg', newHand)));
    prevHandNo = s.handNumber;
  }
  $('me-info').innerHTML = m
    ? `<span class="nm">${escapeHtml(m.name)}</span><span class="cips">筹码 ${fmt(m.chips)}</span>`
    : '';

  renderBanner();
  renderActions();
  renderShowdown();
  tick();
}

function renderBanner(){
  const s = state, m = me(), bn = $('banner');
  bn.innerHTML = '';
  if (!m) return;
  const add = (text, btnText, fn) => {
    const span = document.createElement('span'); span.textContent = text; bn.appendChild(span);
    if (btnText){ const b = button(btnText, 'gold', fn); b.className = 'btn gold'; bn.appendChild(b); }
  };
  if (m.sittingOut) add('你已被设为暂离（超时未操作），下一局不会给你发牌', '回到座位', () => send('sitIn'));
  else if (m.chips === 0 && !(m.inHand && !m.folded && live(s))) add('你的筹码已输光', `补充 ${fmt(s.startingChips)} 筹码`, () => send('rebuy'));
  else if (!m.inHand && live(s)) add('本局进行中，你将在下一局加入');
}

/* ---------- 行动区 ---------- */
function renderActions(){
  const s = state, m = me();
  const bar = $('bottom-bar'), status = $('turn-status'), actions = $('actions');
  const L = s.legal;
  const myTurn = !!L;
  bar.classList.toggle('my-turn', myTurn);
  actions.innerHTML = '';

  if (!myTurn){
    status.classList.remove('my');
    if (s.phase === 'showdown') status.textContent = '本局结束';
    else {
      const cur = s.players[s.currentPlayerIndex];
      status.innerHTML = cur ? `等待 ${escapeHtml(cur.name)} 行动 <span data-secs></span>` : '';
    }
    return;
  }

  status.innerHTML = '轮到你行动 <span data-secs></span>';
  status.classList.add('my');

  const myBet = m.bet;
  const { minRaiseTo: minTo, maxRaiseTo: maxTo } = L;

  actions.appendChild(button('弃牌', 'red', () => act('fold')));
  if (L.canCheck) actions.appendChild(button('过牌', 'teal', () => act('check')));
  else actions.appendChild(button(L.toCall >= m.chips ? `全下跟注 ${fmt(m.chips)}` : `跟注 ${fmt(L.toCall)}`, 'teal', () => act('call')));
  actions.querySelectorAll('.btn').forEach(b => b.style.padding = '');

  if (!L.canRaise) return;

  // 加注组：金额均为"本街加注到"的总额
  const box = document.createElement('div');
  box.id = 'raise-box';
  const slider = document.createElement('input');
  slider.id = 'raise-slider'; slider.type = 'range';
  slider.min = minTo; slider.max = maxTo;
  slider.step = Math.max(1, Math.round(s.smallBlind));

  const val = document.createElement('span'); val.id = 'raise-val';
  const btn = document.createElement('button');
  btn.className = 'btn gold'; btn.style.padding = '9px 16px';

  const turnKey = s.handNumber + ':' + s.phase + ':' + s.currentBet;
  let to = lastRaiseTo;
  if (to === null || turnKey !== lastTurnKey || to < minTo || to > maxTo) to = minTo;
  lastTurnKey = turnKey;

  function paint(){
    slider.value = to;
    const allin = to >= maxTo;
    val.textContent = (allin ? '全下 ' : '') + fmt(to);
    btn.textContent = allin ? `全下 ${fmt(maxTo)}` : (s.currentBet > 0 ? `加注到 ${fmt(to)}` : `下注 ${fmt(to)}`);
  }
  slider.oninput = () => {
    to = Number(slider.value);
    if (maxTo - to < Number(slider.step)) to = maxTo;
    lastRaiseTo = to; paint();
  };
  btn.onclick = () => {
    lastRaiseTo = null;
    if (to >= maxTo) act('all-in'); else act('raise', to);
  };

  const potAfterCall = s.pot + L.toCall;
  const quick = document.createElement('div'); quick.id = 'quick-row';
  [['最小', () => minTo],
   ['½池', () => s.currentBet + Math.round(potAfterCall / 2)],
   ['满池', () => s.currentBet + potAfterCall],
   ['全下', () => maxTo]].forEach(([label, f]) => {
    const q = document.createElement('button');
    q.className = 'btn'; q.textContent = label;
    q.onclick = () => {
      const v = f();
      to = v >= maxTo ? maxTo : Math.max(minTo, Math.round(v / Number(slider.step)) * Number(slider.step));
      lastRaiseTo = to; paint();
    };
    quick.appendChild(q);
  });

  box.appendChild(slider); box.appendChild(val); box.appendChild(quick); box.appendChild(btn);
  actions.appendChild(box);
  paint();
}
let acting = false;
async function act(action, amount){
  if (acting) return;          // 防止连点
  acting = true;
  lastRaiseTo = null;
  await send('playerAction', { action, amount });
  acting = false;
}

/* ---------- 结算 ---------- */
function renderShowdown(){
  const s = state, box = $('showdown');
  if (s.phase !== 'showdown' || !s.result || sdHiddenFor === s.handNumber){
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  const r = s.result;
  $('sd-title').textContent = `第 ${s.handNumber} 局 · ${r.uncontested ? '结算' : '摊牌'}`;

  const won = {};
  r.pots.forEach(pot => pot.winners.forEach(w => { won[w.id] = (won[w.id] || 0) + w.amount; }));

  const pots = $('sd-pots'); pots.innerHTML = '';
  r.pots.forEach((pot, i) => {
    const row = document.createElement('div');
    row.className = 'pot-row';
    const label = r.pots.length === 1 ? '底池' : i === 0 ? '主池' : `边池 ${i}`;
    row.innerHTML = `${label} <b>${fmt(pot.amount)}</b> → ` +
      pot.winners.map(w => `${escapeHtml(w.name)}${pot.winners.length > 1 ? ` (${fmt(w.amount)})` : ''}`).join('、');
    pots.appendChild(row);
  });

  const hands = $('sd-hands'); hands.innerHTML = '';
  if (r.uncontested){
    const w = r.pots[0].winners[0];
    const row = document.createElement('div');
    row.className = 'sd-hand';
    row.innerHTML = `<div class="who">${escapeHtml(w.name)}<span class="desc">其他玩家均已弃牌</span><span class="won">+${fmt(w.amount)}</span></div>`;
    hands.appendChild(row);
  }
  // 赢家排前面
  const sorted = [...r.hands].sort((a, b) => (won[b.id] || 0) - (won[a.id] || 0));
  sorted.forEach(h => {
    const row = document.createElement('div');
    row.className = 'sd-hand';
    row.innerHTML = `<div class="who">${escapeHtml(h.name)}<span class="desc">${escapeHtml(h.description)}</span>` +
      (won[h.id] ? `<span class="won">+${fmt(won[h.id])}</span>` : '') + '</div>';
    const cards = document.createElement('div');
    cards.className = 'cards';
    const addCard = c => {
      const el = cardEl(c, 'c-xs');
      el.classList.add(h.best.some(b => sameCard(b, c)) ? 'hl' : 'dim');
      cards.appendChild(el);
    };
    h.cards.forEach(addCard);
    const gap = document.createElement('span'); gap.className = 'gap'; cards.appendChild(gap);
    s.communityCards.forEach(addCard);
    row.appendChild(cards);
    hands.appendChild(row);
  });

  const btns = $('sd-btns'); btns.innerHTML = '';
  if (iAmController()) btns.appendChild(button('立即开始下一局', 'gold', () => send('nextHand')));
  const m = me();
  if (m && m.chips === 0) btns.appendChild(button(`补充筹码 ${fmt(s.startingChips)}`, 'teal', () => send('rebuy')));
  if (m && m.sittingOut) btns.appendChild(button('回到座位', 'teal', () => send('sitIn')));
  btns.appendChild(button('查看牌桌', 'ghost', () => { sdHiddenFor = s.handNumber; box.classList.add('hidden'); }));
}

/* ---------- 倒计时 ---------- */
function tick(){
  if (!state) return;
  const s = state;
  if (live(s) && s.turnDeadline){
    const left = Math.max(0, s.turnDeadline - serverNow());
    const total = Math.max(1, s.turnDeadline - s.serverNow);
    const secs = Math.ceil(left / 1000);
    document.querySelectorAll('[data-secs]').forEach(e => { e.textContent = `· ${secs}s`; });
    document.querySelectorAll('[data-timer]').forEach(e => {
      e.firstChild.style.width = (100 * left / total) + '%';
      e.classList.toggle('low', left < 8000);
    });
  }
  if (s.phase === 'showdown' && s.nextHandAt){
    const secs = Math.max(0, Math.ceil((s.nextHandAt - serverNow()) / 1000));
    $('sd-count').textContent = `${secs} 秒后自动开始下一局`;
  }
}
setInterval(tick, 250);

/* ---------- 连接 ---------- */
socket.on('connect', async () => {
  $('reconnecting').classList.add('hidden');
  const sess = loadSession();
  if (!sess) { if (!state) showScreen('lobby-screen'); return; }
  const res = await new Promise(r => socket.emit('resume', sess, r));
  if (!res || !res.success){
    saveSession(null);
    state = null;
    $('showdown').classList.add('hidden');
    showScreen('lobby-screen');
    if (sess.roomId) { $('room-input').value = sess.roomId; toast((res && res.error) || '无法回到房间'); }
  }
});
socket.on('disconnect', () => $('reconnecting').classList.remove('hidden'));
socket.on('kicked', ({ reason }) => {
  socket.disconnect();
  $('reconnecting').classList.add('hidden');
  $('conn-lost-msg').textContent = '⚠ ' + (reason || '连接已断开');
  $('conn-lost').classList.remove('hidden');
});

if (!loadSession()) $('name-input').focus();
</script>
</body>
