<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州扑克</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --gold:#d4af37; --gold-light:#f3d97b;
  --felt1:#2f8f5e; --felt2:#17603d; --felt3:#0f3f28;
  --bg:#0c1f14; --panel:rgba(10,25,16,.94);
  --red:#d0192b; --ink:#f3ecd8;
  --line:rgba(212,175,55,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:radial-gradient(ellipse at 50% 20%, #143726, var(--bg) 70%);
  color:var(--ink); overflow:hidden;
  font-variant-numeric:tabular-nums;   /* 筹码/计时数字等宽，跳动时不抖 */
}
.hidden{display:none !important}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

/* ============ 通用按钮 ============ */
.btn{border-radius:10px;font-weight:700;letter-spacing:1px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
/* 键盘操作时给出清晰的焦点框（鼠标点击不显示，避免影响观感） */
:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{padding:13px 18px;font-size:17px;width:100%}
.btn.small{padding:5px 12px;font-size:12px}
.btn.gold{background:linear-gradient(180deg,#f0cf6e,#c69a2c);color:#3a2c05;border:1px solid #8a6d1c;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
.btn.red{background:linear-gradient(180deg,#e05a4e,#b3202c);color:#fff;border:1px solid #7d1420}
.btn.red:hover:not(:disabled){filter:brightness(1.1)}
.btn.teal{background:linear-gradient(180deg,#3fae8f,#1f7f63);color:#fff;border:1px solid #14563f}
.btn.teal:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid rgba(243,236,216,.35);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:rgba(243,236,216,.7)}

/* ============ 大厅 ============ */
#lobby-screen{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.lobby-card,.room-card{
  background:linear-gradient(180deg,#123524,#0b2417);
  border:1px solid var(--line);border-radius:18px;padding:34px 30px;
  width:min(380px,92vw);display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.logo{font-size:27px;font-weight:900;letter-spacing:3px;color:var(--gold-light);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.logo .red{color:#ff5d6c}
.sub{font-size:13px;color:rgba(243,236,216,.6);margin-top:-6px}
.txt-input{
  background:rgba(0,0,0,.35);border:1px solid rgba(243,236,216,.25);color:var(--ink);
  border-radius:10px;padding:11px 12px;font-size:15px;width:100%;text-align:center;outline:none;
}
.txt-input:focus{border-color:var(--gold)}
.divider{width:100%;display:flex;align-items:center;gap:10px;color:rgba(243,236,216,.5);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(243,236,216,.18)}
.join-row{display:flex;gap:10px;width:100%}
.join-row .txt-input{text-transform:uppercase;letter-spacing:4px;font-weight:700}
.join-row .btn{flex-shrink:0;padding:11px 22px}
.primary-hint{font-size:12px;color:rgba(243,236,216,.5);margin-top:-6px;text-align:center}
.me-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid rgba(243,236,216,.25);background:rgba(0,0,0,.25);
  font-size:13px;color:rgba(243,236,216,.85);cursor:pointer;transition:border-color .15s,color .15s;
}
.chip::after{content:'✏️';font-size:11px;opacity:.7}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.name-input{width:auto;min-width:150px;padding:7px 12px;font-size:13px}
.link-btn{
  background:none;border:none;color:rgba(243,236,216,.5);font-size:12px;
  text-decoration:underline;text-underline-offset:3px;padding:2px 6px;
}
.link-btn:hover{color:var(--gold-light)}
#join-panel{width:100%}

/* ============ 等待室 ============ */
#room-screen{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
.hint{font-size:12px;color:rgba(243,236,216,.55)}
.room-id{
  font-size:42px;font-weight:900;letter-spacing:12px;
  color:var(--gold-light);cursor:pointer;padding-left:12px;text-shadow:0 2px 10px rgba(0,0,0,.5);
}
#room-players{width:100%;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.pl{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;
  border:1px solid rgba(243,236,216,.15);border-radius:10px;font-size:14px}
.pl .nm{font-weight:700}
.pl .cips{color:var(--gold-light)}
.pl .me-tag{font-size:11px;color:rgba(243,236,216,.55);margin-left:6px}
.pl .crown{margin-right:4px}
#room-actions{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}

/* ============ 游戏屏 ============ */
#game-screen{display:flex;flex-direction:column;height:100vh;height:100dvh}
#game-screen > header{
  display:flex;align-items:center;gap:16px;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;flex-shrink:0;
}
#game-screen > header b{color:var(--gold-light);letter-spacing:2px}
#game-screen > header .sp{flex:1}
#g-phase{padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-weight:700}

#table-wrap{flex:1;position:relative;min-height:280px}
/* 外圈：木框。用斜向条纹叠两层渐变模拟木纹 */
#table{
  position:absolute;inset:9% 6%;border-radius:50%;
  background:
    repeating-linear-gradient(112deg,rgba(0,0,0,.17) 0 2px,rgba(255,232,190,.05) 2px 4px,transparent 4px 9px),
    linear-gradient(150deg,#8b6136,#5b3d21 38%,#7d5430 62%,#462c19);
  box-shadow:0 14px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,225,170,.12);
}
/* 内圈：台面。顶部聚光 + 四周暗角，形成纵深 */
#table::before{
  content:'';position:absolute;inset:9px;border-radius:50%;
  background:
    radial-gradient(ellipse 60% 54% at 50% 42%,rgba(255,255,255,.14),rgba(255,255,255,0) 62%),
    radial-gradient(ellipse at 50% 42%,var(--felt1),var(--felt2) 58%,var(--felt3));
  box-shadow:
    inset 0 0 80px rgba(0,0,0,.62),
    inset 0 12px 26px rgba(0,0,0,.45),
    0 0 0 3px rgba(0,0,0,.38);
}
/* 金线：台面内侧一圈，带微弱自发光 */
#table::after{
  content:'';position:absolute;inset:22px;border-radius:50%;
  border:2px solid rgba(212,175,55,.38);
  box-shadow:inset 0 0 22px rgba(212,175,55,.10);
  pointer-events:none;
}
#community{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:1}
#pot{color:var(--gold-light);font-weight:800;font-size:16px;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#board{display:flex;gap:8px;justify-content:center}

/* ============ 扑克牌 ============ */
.card{
  background:linear-gradient(160deg,#fff,#eceada);border:1px solid #cfc9b4;border-radius:8%;
  box-shadow:0 2px 6px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;flex-shrink:0;user-select:none;
}
.card .r{line-height:1.05}
.card .s{line-height:1}
.card.red{color:#c8102e}.card.blk{color:#1b1b1b}
.card.back{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 5px,transparent 5px 10px),#274c9e;
  border-color:#16295e;
}
.c-lg{width:64px;height:90px;font-size:22px}
.c-md{width:54px;height:76px;font-size:18px}
.c-sm{width:31px;height:44px;font-size:10px}
.c-xs{width:26px;height:37px;font-size:9px}
.slot{border:2px dashed rgba(243,236,216,.22);border-radius:8%;flex-shrink:0}
.slot.md{width:54px;height:76px}
/* 发牌：落下时带回弹，比匀速淡入更有手感 */
@keyframes dealIn{
  0%{transform:translateY(-20px) rotate(-9deg) scale(.55);opacity:0}
  62%{transform:translateY(2px) rotate(2deg) scale(1.03);opacity:1}
  100%{transform:none;opacity:1}
}
.card.deal{animation:dealIn .4s cubic-bezier(.22,.9,.3,1.2)}

/* ============ 座位 ============ */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column-reverse;
  align-items:center;gap:5px;z-index:2;width:max-content}
.seat.top{flex-direction:column}
.hole{display:flex}
.hole .card{border-radius:10%}
.hole .card:last-child{margin-left:-10px}
/* 名牌 = 头像 + 文字两行 */
.plaque{
  display:flex;align-items:center;gap:7px;text-align:left;
  min-width:112px;max-width:152px;padding:6px 10px 6px 6px;
  background:var(--panel);border:1px solid rgba(212,175,55,.45);border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
/* 头像：颜色由昵称哈希决定，同一个人每次进来颜色一致 */
.avatar{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-size:13px;line-height:1;font-weight:900;
  color:rgba(8,20,14,.92);
  border:1.5px solid rgba(212,175,55,.55);
  box-shadow:
    inset 0 -6px 10px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,255,255,.22),
    0 2px 5px rgba(0,0,0,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.18);
}
.p-body{min-width:0;flex:1;display:flex;flex-direction:column}
.p-name{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:flex-start;gap:5px;
  white-space:nowrap;overflow:hidden;max-width:104px}
.p-chips{color:var(--gold-light);font-size:12px;margin-top:1px}
/* 轮到谁：整块座位透出金色光晕，配合名牌呼吸 */
.seat.current{animation:seatBreathe 1.6s ease-in-out infinite}
@keyframes seatBreathe{
  0%,100%{filter:drop-shadow(0 0 9px rgba(212,175,55,.45))}
  50%{filter:drop-shadow(0 0 20px rgba(212,175,55,.85))}
}
.seat.current .plaque{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(212,175,55,.55),0 0 20px rgba(212,175,55,.55);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(212,175,55,.85),0 0 30px rgba(212,175,55,.8)}}
/* 赢家：结算时桌上那一家亮起来 */
.seat.winner{filter:drop-shadow(0 0 16px rgba(255,212,110,.65))}
.seat.winner .plaque{
  border-color:#ffe9a8;
  box-shadow:0 0 0 2px rgba(255,215,120,.8),0 0 28px rgba(255,205,90,.7);
}
.seat.folded{opacity:.45;filter:saturate(.35)}
.tag{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:800;flex-shrink:0}
.tag.allin{background:#b3202c;color:#fff}
.tag.disc{background:#666;color:#ddd}
.tag.dealer{background:var(--gold);color:#3a2c05}
.bubble{
  position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.72);border:1px solid rgba(243,236,216,.25);
  padding:2px 9px;border-radius:10px;font-size:11px;white-space:nowrap;
}
.seat.top .bubble{bottom:auto;top:calc(100% + 4px)}
.bet{
  position:absolute;transform:translate(-50%,-50%);z-index:1;
  background:radial-gradient(circle at 35% 30%,#f6d97c,#caa030 60%,#9a7417);
  color:#3a2c05;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px dashed rgba(58,44,5,.6);box-shadow:0 2px 5px rgba(0,0,0,.4);white-space:nowrap;
  animation:betPop .24s cubic-bezier(.22,.9,.3,1.3);
}
@keyframes betPop{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
  70%{transform:translate(-50%,-50%) scale(1.08)}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* ============ 底部行动区 ============ */
#bottom-bar{
  display:flex;align-items:center;gap:20px;padding:13px 18px;flex-shrink:0;
  background:var(--panel);border-top:1px solid var(--line);
  min-height:118px;flex-wrap:wrap;
}
#bottom-bar.my-turn{box-shadow:inset 0 0 0 2px rgba(212,175,55,.5)}
#my-cards{display:flex}
#my-cards .card:last-child{margin-left:-12px;transform:rotate(6deg)}
#me-info{display:flex;flex-direction:row;align-items:center;gap:9px;font-size:13px;min-width:112px}
#me-info .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
#me-info .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;max-width:110px}
#me-info .cips{color:var(--gold-light);font-weight:700}
#me-info .myhand{font-size:11px;color:#9fe0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
#action-bar{flex:1;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
#turn-status{font-size:13px;color:#cfe6d6}
#turn-status.my{color:var(--gold-light);font-weight:800;font-size:15px}
#actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#actions .btn{padding:11px 20px;font-size:15px}
#raise-box{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);
  border:1px solid rgba(243,236,216,.2);border-radius:12px;padding:8px 12px}
#raise-slider{width:150px;accent-color:var(--gold)}
#raise-input{width:76px;padding:5px 6px;text-align:center;font-size:13px;font-weight:700;color:var(--gold-light);
  background:rgba(0,0,0,.4);border:1px solid rgba(243,236,216,.3);border-radius:8px;outline:none;
  -moz-appearance:textfield}
#raise-input:focus{border-color:var(--gold)}
#raise-input::-webkit-outer-spin-button,#raise-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#raise-val{font-weight:800;color:var(--gold-light);min-width:66px;text-align:center;font-size:14px}
#quick-row{display:flex;gap:6px}
#quick-row .btn{padding:5px 10px;font-size:12px;white-space:nowrap;background:rgba(243,236,216,.08);
  border:1px solid rgba(243,236,216,.3);color:var(--ink)}
#quick-row .btn:hover{border-color:var(--gold)}

/* ============ 摊牌弹层 ============ */
#showdown{position:fixed;inset:0;background:rgba(4,12,8,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50}
#showdown .panel{
  background:linear-gradient(180deg,#123524,#0b2417);border:2px solid var(--gold);
  border-radius:16px;padding:24px 28px;min-width:320px;max-width:92vw;max-height:84vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
#showdown h2{font-size:19px;color:var(--gold-light);letter-spacing:2px}
.winner-row{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;
  border-bottom:1px dashed rgba(243,236,216,.2);padding-bottom:12px}
.winner-row:last-of-type{border-bottom:none}
.winner-row .who{font-weight:800;font-size:15px}
.winner-row .who .desc{color:var(--gold-light);margin-left:8px}
.winner-row .cards{display:flex;gap:5px}

/* ============ 提示与遮罩 ============ */
#toast-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(18,18,18,.92);border:1px solid var(--line);color:var(--ink);
  padding:9px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:dealIn .25s ease-out}
#conn-lost{position:fixed;inset:0;background:rgba(4,12,8,.88);z-index:100;
  display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-size:17px}
/* 请求进行中的按钮：禁用感 + 呼吸，避免连点发两次 */
.btn.busy{opacity:.6;cursor:progress;transform:none}
#confirm-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:97;
  display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;
  background:rgba(12,26,18,.97);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.6);
  font-size:14px;max-width:min(560px,92vw);animation:dealIn .2s ease-out}
#confirm-bar .msg{flex:1;line-height:1.4;color:var(--ink)}
#confirm-bar .btn{padding:7px 16px;font-size:13px;flex-shrink:0}

/* ============ 新增：计时 / 状态标签 / 重连 ============ */
.room-id{display:block}
.tag.out{background:#555;color:#eee}
.tag.wait{background:#2d5d8a;color:#e6f1ff}
.tag.host{background:transparent;padding:0}
.p-timer{height:3px;border-radius:2px;background:rgba(243,236,216,.15);margin-top:4px;overflow:hidden}
/* 用 transform 缩放代替 width：不触发布局，250ms 一次的刷新不再引起重排 */
.p-timer > i{display:block;height:100%;background:var(--gold);transform-origin:left center;
  transform:scaleX(1);transition:transform .25s linear}
.p-timer.low > i{background:#e05a4e}
.hole.shown .card{border-radius:8%}
.hole.shown .card:last-child{margin-left:2px}
.card.hl{box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(0,0,0,.45)}
.card.dim{opacity:.4}
#banner{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:7px 12px;background:rgba(45,93,138,.35);border-bottom:1px solid rgba(243,236,216,.15);font-size:13px}
#banner:empty{display:none}
#banner .btn{padding:5px 14px;font-size:12px}
#reconnecting{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:98;
  background:rgba(18,18,18,.92);border:1px solid var(--line);padding:9px 18px;border-radius:10px;font-size:14px}
#room-extra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pl .tagbox{display:flex;gap:5px;align-items:center}
.pot-row{font-size:13px;color:rgba(243,236,216,.75);text-align:center}
.pot-row b{color:var(--gold-light)}
#sd-hands{width:100%;display:flex;flex-direction:column;gap:10px}
.sd-hand{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px dashed rgba(243,236,216,.2);padding-bottom:10px}
.sd-hand:last-child{border-bottom:none}
.sd-hand .who{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:2px}
.sd-hand .who .desc{color:var(--gold-light);font-weight:600;font-size:12px}
.sd-hand .who .won{color:#7fe0b0;font-size:12px}
.sd-hand .cards{display:flex;gap:4px;align-items:center}
.sd-hand .cards .gap{width:8px}
#sd-foot{display:flex;flex-direction:column;gap:8px;align-items:center}
#sd-count{font-size:12px;color:rgba(243,236,216,.6)}
#sd-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.narrow{display:none}

/* ============ 窄屏适配 ============ */
@media (max-width:720px){
  .c-lg{width:52px;height:74px;font-size:18px}
  .c-md{width:44px;height:62px;font-size:15px}
  .c-sm{width:26px;height:37px;font-size:8px}
  .slot.md{width:44px;height:62px}
  .plaque{min-width:96px;gap:6px;padding:5px 7px 5px 5px}
  .avatar{width:20px;height:20px;font-size:10px;border-width:1px}
  .p-name{font-size:11px;max-width:74px;gap:3px}
  .p-chips{font-size:10px}
  #bottom-bar{gap:10px;padding:10px}
  #actions .btn{padding:9px 14px;font-size:13px}
  #raise-slider{width:auto;flex:1;min-width:90px}
  /* 窄屏：输入框自己就能显示金额，右边重复的数字标签省掉，把宽度让给输入框 */
  #raise-input{width:84px}
  #raise-val{display:none}
  #action-bar{flex-basis:100%;align-items:stretch;gap:7px}
  #turn-status{text-align:center}
  #actions{justify-content:center;gap:8px}
  #raise-box{flex-wrap:wrap;justify-content:center;width:100%;padding:8px;gap:8px}
  #quick-row{order:3;width:100%;justify-content:center}
  #raise-box .btn.gold{order:4;width:100%}
  #banner{font-size:12px}
  .room-id{font-size:34px;letter-spacing:8px}
  #game-screen > header{gap:6px;font-size:11px;padding:8px 10px;flex-wrap:nowrap;white-space:nowrap}
  #game-screen > header .lbl{display:none}
  #g-phase{padding:2px 8px}
  #btn-leave-game{padding:4px 9px;font-size:11px}
  .wide{display:none}
  .narrow{display:inline}
}

/* ============ 方向1/3：增量渲染 + 牌桌表现力 ============ */
/* 座位/下注节点复用后，位置变化靠过渡变平滑，不再整块重建 */
.seat{transition:left .45s cubic-bezier(.2,.8,.3,1),top .45s cubic-bezier(.2,.8,.3,1)}
.bet{transition:left .45s cubic-bezier(.2,.8,.3,1),top .45s cubic-bezier(.2,.8,.3,1)}
/* 公共牌格：常驻 5 格，牌只在出现时飞入并 3D 翻转 */
#board{perspective:820px;perspective-origin:50% 45%}
.bcell{position:relative;width:54px;height:76px;flex-shrink:0}
.bcell>.card,.bcell>.slot{position:absolute;inset:0;width:100%;height:100%}
.bcell>.card{backface-visibility:hidden;will-change:transform}
.hole{perspective:520px}
.hole .card{backface-visibility:hidden}
/* 飞行中的筹码 */
.chipfly{
  position:absolute;z-index:6;width:14px;height:14px;border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 34% 30%,#f7df8d,#c79f2f 62%,#8d6a12);
  box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.35);
}
/* all-in 全屏泛红 */
#allin-flash{
  position:fixed;inset:0;z-index:80;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,72,60,.55),rgba(130,0,0,.35) 45%,transparent 76%);
}
/* 赢家收池时的 +N */
.won-tag{
  position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);
  font-weight:900;font-size:15px;color:#ffe9a8;
  text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 14px rgba(255,205,90,.8);
}
@media (max-width:720px){
  .bcell{width:44px;height:62px}
}
/* 尊重系统"减少动态效果"：动效全部关掉，只保留状态变化 */
@media (prefers-reduced-motion: reduce){
  .seat,.bet{transition:none}
  .seat.current,.seat.current .plaque{animation:none}
  .card.deal,.toast{animation:none}
}
</style>
</head>
<body>

<div id="toast-box"></div>
<div id="allin-flash"></div>

<!-- 大厅 -->
<div id="lobby-screen">
  <div class="lobby-card">
    <div class="logo"><span class="red">♥</span>♠ 德州扑克 ♦<span class="red">♣</span></div>
    <p class="sub">与好友在线对战 · 房间制多人德州</p>
    <button id="btn-primary" class="btn gold big">开始牌局</button>
    <p id="primary-hint" class="primary-hint">一键开局，不用填任何东西</p>
    <div class="me-row">
      <span id="name-chip" class="chip" title="点击修改昵称">玩家</span>

</div>

<!-- 游戏屏 -->
<div id="game-screen" class="hidden">
  <header>
    <span><span class="lbl">房间 </span><b id="g-room" title="点击复制邀请链接" style="cursor:pointer">------</b></span>
    <span><span class="lbl">盲注 </span><b id="g-blind">50/100</b></span>
    <span id="g-hand"></span>
    <span class="sp"></span>
    <span id="g-phase">等待</span>
    <button id="btn-leave-game" class="btn ghost small"><span class="wide">离开牌桌</span><span class="narrow">离开</span></button>
  </header>
  <div id="banner"></div>

  <div id="table-wrap">
    <div id="table">
      <div id="community">
        <div id="pot"></div>
        <div id="board"></div>
      </div>
    </div>
  </div>

  <div id="bottom-bar">
    <div id="my-cards"></div>
    <div id="me-info"></div>
    <div id="action-bar">
      <div id="turn-status" role="status" aria-live="polite"></div>
      <div id="actions"></div>

</div>

<!-- 结算弹层 -->
<div id="showdown" class="hidden" role="dialog" aria-modal="true" aria-labelledby="sd-title" title="点空白处关闭">
  <div class="panel">
    <h2 id="sd-title">摊牌</h2>
    <div id="sd-pots"></div>
    <div id="sd-hands"></div>
    <div id="sd-foot">
      <div id="sd-count"></div>
      <div id="sd-btns"></div>
    </div>
  </div>
</div>

<!-- 重连提示 -->
<div id="reconnecting" class="hidden">⏳ 网络断开，正在重新连接…</div>

<!-- 无法恢复时的遮罩 -->
<div id="conn-lost" class="hidden">
  <div id="conn-lost-msg">⚠ 与服务器的连接已断开</div>
  <button onclick="location.reload()" class="btn gold" style="padding:11px 30px">重新进入</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 常量 ---------- */
const PHASE_NAME = {waiting:'等待中',preflop:'翻牌前',flop:'翻牌圈',turn:'转牌圈',river:'河牌圈',showdown:'结算'};
const ACTION_NAME = {fold:'弃牌',check:'过牌',call:'跟注',raise:'加注','all-in':'全下'};
const RED_SUITS = new Set(['♥','♦']);
const SESSION_KEY = 'poker-session';

/* ---------- 状态 ---------- */
// 服务器用令牌认人：刷新页面或断线重连后凭令牌回到原座位
const socket = io({ reconnectionDelay: 800, reconnectionDelayMax: 4000 });
let state = null;          // 最近一次 gameState
let clockOffset = 0;       // 服务器时间 - 本地时间
let lastRaiseTo = null;    // 记住滑杆位置，重渲染时不重置
let lastTurnKey = '';      // 轮次标识，换人/换局则重置滑杆
let sdHiddenFor = 0;       // 本局结算弹层被手动关闭

/* ---------- 增量渲染状态（方向1） ---------- */
const seatViews = new Map();  // playerId -> 复用的座位节点及子节点引用
const betViews = new Map();   // playerId -> 复用的下注筹码节点
let boardCells = null;        // 5 个固定公共牌格子
let myCardsKey = '';          // 我手牌的差异签名
let meInfoEls = null;         // 底部“我”的信息节点引用
let pendingPotFlights = [];   // 本帧要飞进底池的筹码起点
let shownPot = 0;             // 底池当前显示值（滚动动画起点）
let potRaf = 0;               // 底池滚动动画句柄
let dealtHandNo = 0;          // 已处理发牌动画的局号
let showdownFxHand = 0;       // 已播放收池动画的局号
const allInFxSeen = new Set();// 已播放 all-in 反馈的 `${局号}:${playerId}`
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function loadSession(){
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)) || null; } catch { return null; }
}
function saveSession(s){
  try { s ? sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)) : sessionStorage.removeItem(SESSION_KEY); } catch {}
}

/* ---------- 工具 ---------- */
function toast(msg, ms = 2600){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  $('toast-box').appendChild(d);
  setTimeout(() => d.remove(), ms);
}
// 自绘确认条：confirm() 会阻塞渲染、移动端样式难看，还会打断正在跑的动画
let confirmBarEl = null;
function confirmBar(msg, okText, onOk){
  closeConfirmBar();
  const bar = document.createElement('div');
  bar.id = 'confirm-bar';
  bar.setAttribute('role', 'alertdialog');
  bar.setAttribute('aria-label', msg);
  const text = document.createElement('span');
  text.className = 'msg'; text.textContent = msg;
  const ok = document.createElement('button');
  ok.className = 'btn red small'; ok.textContent = okText || '确定';
  const no = document.createElement('button');
  no.className = 'btn ghost small'; no.textContent = '取消';
  ok.onclick = () => { closeConfirmBar(); onOk && onOk(); };
  no.onclick = closeConfirmBar;
  bar.append(text, no, ok);
  document.body.appendChild(bar);
  confirmBarEl = bar;
  ok.focus();
  return bar;
}
function closeConfirmBar(){
  if (confirmBarEl){ confirmBarEl.remove(); confirmBarEl = null; }
}
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showScreen(id){
  ['lobby-screen','room-screen','game-screen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}
function cardEl(card, size, animate){
  if (!card) return backEl(size);
  const el = document.createElement('div');
  el.className = `card ${size} ${RED_SUITS.has(card.suit) ? 'red' : 'blk'}` + (animate ? ' deal' : '');
  el.innerHTML = `<span class="r">${card.rank}</span><span class="s">${card.suit}</span>`;
  return el;
}
/* 头像：昵称首字 + 由昵称哈希固定的配色，同一玩家每次进来颜色一致 */
function avatarEl(name){
  const el = document.createElement('span');
  el.className = 'avatar';
  const chars = [...String(name || '?')];
  el.textContent = (chars[0] || '?').toUpperCase();
  // FNV-1a：只差一两个字符的名字（Bot1/Bot2…）也能散到相差很远的色相
  let h = 2166136261;
  for (const ch of chars){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  h = (h >>> 0) % 360;
  el.style.background = `linear-gradient(155deg,hsl(${h} 62% 62%),hsl(${(h + 24) % 360} 55% 38%))`;
  return el;
}
function backEl(size){
  const el = document.createElement('div');
  el.className = `card back ${size}`;
  return el;
}
const sameCard = (a, b) => a && b && a.rank === b.rank && a.suit === b.suit;
function serverNow(){ return Date.now() + clockOffset; }
function inviteLink(){
  return `${location.origin}${location.pathname}?room=${state ? state.roomId : ''}`;
}
function copyInvite(){
  if (!state) return;
  const link = inviteLink();
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .then(() => toast('邀请链接已复制，发给好友即可加入'), () => toast('房间号: ' + state.roomId));
}
// 统一发请求：带超时。之前没有超时，一旦服务端不回调（断线/异常），
// await 就永远挂着，act() 的 acting 锁再也解不开，之后所有行动按钮全失效。
function send(ev, data, timeoutMs = 8000){
  return new Promise(resolve => {
    let settled = false;
    const finish = res => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (res && !res.success && res.error && res.error !== TIMEOUT) toast(res.error);
      resolve(res || { success: false, error: TIMEOUT });
    };
    const timer = setTimeout(() => {
      if (!socket.connected){ toast('网络已断开，正在重连…'); }
      else toast('服务器响应超时，请重试');
      finish({ success: false, error: TIMEOUT });
    }, timeoutMs);
    if (!socket.connected){
      // 断线时 socket.io 会把包缓存到重连后，这里直接失败，避免按钮看起来没反应
      finish({ success: false, error: '网络已断开' });
      return;
    }
    socket.emit(ev, data || {}, finish);
  });
}
const TIMEOUT = 'timeout';
// 给按钮上锁：连点只会发一次请求（大厅「开始牌局」连点会建出两个房间）
function bindBusy(btn, fn){
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (btn.dataset.busy) return;
    btn.dataset.busy = '1';
    btn.classList.add('busy');
    try { await fn(); }
    finally { btn.dataset.busy = ''; btn.classList.remove('busy'); }
  });
}
function iAmController(){
  if (!state) return false;
  const host = state.players.find(p => p.id === state.hostId);
  return state.myId === state.hostId || !host || !host.connected;
}
const me = () => state && state.players[state.myIndex];

/* ---------- 大厅 ---------- */
let urlRoom = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase();

function genName(){
  return '玩家' + Math.random().toString(36).slice(2, 6).toUpperCase();
}
// 昵称自动生成并记住，用户不需要一上来就输入
let myName = (() => {
  try { return (localStorage.getItem('poker-name') || '').trim().slice(0, 12) || genName(); } catch { return genName(); }
})();
function renderName(){
  $('name-chip').textContent = myName;
  $('name-input').value = myName;
}
function saveName(v){
  const n = String(v || '').trim().slice(0, 12);
  if (n) myName = n;
  try { localStorage.setItem('poker-name', myName); } catch {}
  renderName();
}
function getName(){ return myName; }

/* 昵称：点一下就能改，不点也不影响开局 */
$('name-chip').onclick = () => {
  $('name-chip').classList.add('hidden');
  $('name-input').classList.remove('hidden');
  $('name-input').focus();
  $('name-input').select();
};
function closeNameEdit(commit){
  if (commit) saveName($('name-input').value); else renderName();
  $('name-input').classList.add('hidden');
  $('name-chip').classList.remove('hidden');
}
$('name-input').addEventListener('blur', () => closeNameEdit(true));
$('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('name-input').blur();
  if (e.key === 'Escape'){ $('name-input').value = myName; $('name-input').blur(); }
});

function showJoinPanel(focus){
  $('join-panel').classList.remove('hidden');
  $('btn-toggle-join').textContent = '收起';
  if (focus) $('room-input').focus();
}

function applyLobbyMode(){
  if (urlRoom){
    // 从邀请链接进来：主按钮直接变成「加入房间 XXXX」，不用输任何东西
    $('btn-primary').textContent = `加入房间 ${urlRoom}`;
    $('primary-hint').textContent = '好友在等你，点击直接入座';
    $('btn-toggle-join').classList.add('hidden');
    $('btn-create-other').classList.remove('hidden');
    $('room-input').value = urlRoom;
  } else {
    $('btn-primary').textContent = '开始牌局';
    $('primary-hint').textContent = '一键开局，不用填任何东西';
    $('btn-toggle-join').classList.remove('hidden');
    $('btn-create-other').classList.add('hidden');
  }
}
applyLobbyMode();

// 被邀请进来但想自己开桌
bindBusy($('btn-create-other'), () => {
  urlRoom = '';
  history.replaceState(null, '', location.pathname);
  $('room-input').value = '';
  $('join-panel').classList.add('hidden');
  $('btn-toggle-join').textContent = '我有房间号';
  applyLobbyMode();
  return createRoom();
});
$('btn-toggle-join').onclick = () => {
  const shown = !$('join-panel').classList.contains('hidden');
  $('join-panel').classList.toggle('hidden', shown);
  $('btn-toggle-join').textContent = shown ? '我有房间号' : '收起';
  if (!shown) $('room-input').focus();
};

async function createRoom(){
  const res = await send('createRoom', { name: getName(), bigBlind: 100 });
  if (res.success) saveSession({ roomId: res.roomId, token: res.token });
}
bindBusy($('btn-primary'), () => (urlRoom ? joinRoom(urlRoom) : createRoom()));

bindBusy($('btn-join'), () => joinRoom());
$('room-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
async function joinRoom(roomIdArg){
  const roomId = String(roomIdArg || $('room-input').value || '').trim().toUpperCase();
  if (!roomId){ toast('请输入房间号'); $('room-input').focus(); return; }
  const res = await send('joinRoom', { roomId, name: getName() });
  if (res.success) saveSession({ roomId: res.roomId, token: res.token });
}
async function leave(){
  await send('leaveRoom');
  saveSession(null);
  state = null;
  history.replaceState(null, '', location.pathname);
  $('showdown').classList.add('hidden');
  showScreen('lobby-screen');
}

/* ---------- 等待室 ---------- */
function renderRoom(){
  const s = state;
  $('room-id').textContent = s.roomId;
  const box = $('room-players'); box.innerHTML = '';
  s.players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'pl';
    let tags = '';
    if (!p.connected) tags += '<span class="tag disc">断线</span>';
    else if (p.sittingOut) tags += '<span class="tag out">暂离</span>';
    row.innerHTML =
      `<span class="nm">${p.id === s.hostId ? '<span class="crown">👑</span>' : ''}${escapeHtml(p.name)}` +
      `${i === s.myIndex ? '<span class="me-tag">(你)</span>' : ''}</span>` +
      `<span class="tagbox">${tags}<span class="cips">筹码 ${fmt(p.chips)}</span></span>`;
    box.appendChild(row);
  });

  const extra = $('room-extra'); extra.innerHTML = '';
  const m = me();
  if (m && m.chips === 0) extra.appendChild(button(`补充筹码 ${fmt(s.startingChips)}`, 'teal', () => send('rebuy')));
  if (m && m.sittingOut) extra.appendChild(button('回到座位', 'teal', () => send('sitIn')));

  const ready = s.players.filter(p => p.connected && !p.sittingOut && p.chips > 0).length;
  const ctrl = iAmController();
  $('btn-start').classList.toggle('hidden', !ctrl);
  $('btn-start').textContent = s.handNumber > 0 ? '继续游戏' : '开始游戏';
  $('btn-start').disabled = ready < 2;
  $('room-hint').textContent = !ctrl ? '等待房主开始游戏…'
    : ready < 2 ? '等待更多玩家加入（至少 2 名有筹码的玩家）' : '人齐了，可以开局！';
}
function button(text, color, onclick){
  const b = document.createElement('button');
  b.className = `btn ${color}`; b.style.padding = '9px 18px';
  b.textContent = text; b.onclick = onclick;
  return b;
}
$('room-id').onclick = copyInvite;
$('btn-copy-invite').onclick = copyInvite;
$('g-room').onclick = copyInvite;
bindBusy($('btn-start'), () => send('startGame'));
$('btn-leave-waiting').onclick = leave;
$('btn-leave-game').onclick = () => {
  const m = me();
  const inHand = m && m.inHand && !m.folded && state.phase !== 'showdown' && state.phase !== 'waiting';
  confirmBar(
    inHand ? '牌局进行中离开将自动弃牌，确定离开？' : '确定离开牌桌？',
    '离开', () => leave()
  );
};

/* ---------- 状态接收 ---------- */
socket.on('gameState', s => {
  state = s;
  clockOffset = s.serverNow - Date.now();
  if (s.phase === 'waiting'){
    $('showdown').classList.add('hidden');
    renderRoom();
    showScreen('room-screen');
  } else {
    showScreen('game-screen');
    renderGame();
  }
});

/* ---------- 游戏渲染 ---------- */
function seatPos(i, n){
  // 让"我"始终坐在正下方，其余玩家绕椭圆排布（旁观时以 0 号为基准）
  const base = state.myIndex >= 0 ? state.myIndex : 0;
  const a = (90 + (i - base) * (360 / n)) * Math.PI / 180;
  const cos = Math.cos(a), sin = Math.sin(a);
  // 贴近桌沿的座位把半径收进来，保证名牌整个落在桌面上（不压在木边上）
  // 横向：名牌最宽 152px（含头像），桌面内侧留白约 70px => 最多 36%；纵向还要让开牌和间距
  const rx = Math.min(46, 36 / Math.max(0.2, Math.abs(cos)));
  const ry = Math.min(42, 32.5 / Math.max(0.2, Math.abs(sin)));
  let x = 50 + rx * cos;
  let y = 50 + ry * sin;

  // 窄屏避让：手机竖屏时中央的底池+公共牌几乎占满桌面宽度，
  // 处在水平两侧的座位（cos 很大、sin 接近 0，比如 4 人桌的左右两家）
  // 会正好压在公共牌上。这里把这类座位沿纵向推开，让出中间那条带。
  // 只对 6 人以内生效：8 人桌两侧各挤了 3 个座位，纵向没有余量可让，
  // 硬推会和相邻座位叠在一起（实测），那种桌子只能接受轻微遮挡。
  const w = ($('table-wrap') || {}).clientWidth || 0;
  if (w && w < 560 && n <= 6 && Math.abs(cos) > 0.55){
    const flat = Math.abs(sin) < 0.3;
    // 正侧面的座位没有天然上下方向，按"前半圈向上、后半圈向下"分配，左右对称
    const dir = flat
      ? ((((i - base) % n) + n) % n < n / 2 ? -1 : 1)
      : Math.sign(sin);
    y = 50 + dir * Math.max(Math.abs(ry * sin), 26);
  }
  return { x, y, top: y < 50 };
}

const live = s => ['preflop','flop','turn','river'].includes(s.phase);

/* ================= 动效工具（方向3）=================
   一律走 Web Animations API：动画结束自动回到 CSS 状态，
   不依赖重建 DOM，因此可以和增量渲染共存。 */
function anim(el, frames, opts){
  if (!el || reduceMotion || typeof el.animate !== 'function') return null;
  return el.animate(frames, Object.assign({ duration: 380, easing: 'cubic-bezier(.2,.8,.3,1.1)', fill: 'none' }, opts));
}
// 元素中心点，坐标相对 #table-wrap（筹码飞行的起终点）
function relCenter(el){
  if (!el) return null;
  const r = el.getBoundingClientRect(), w = $('table-wrap').getBoundingClientRect();
  return { x: r.left + r.width / 2 - w.left, y: r.top + r.height / 2 - w.top };
}
// 发牌轨迹：从桌心飞向元素当前所在位置
function flyFromCenter(el, delay){
  if (!el || reduceMotion) return;
  const r = el.getBoundingClientRect(), w = $('table-wrap').getBoundingClientRect();
  const dx = (w.left + w.width / 2) - (r.left + r.width / 2);
  const dy = (w.top + w.height / 2) - (r.top + r.height / 2);
  const base = getComputedStyle(el).transform;
  anim(el, [
    { transform: `translate(${dx}px,${dy}px) rotate(-14deg) scale(.5)`, opacity: 0 },
    { transform: `translate(${dx * .12}px,${dy * .12}px) rotate(2deg) scale(1.05)`, opacity: 1, offset: .74 },
    { transform: base === 'none' ? 'none' : base, opacity: 1 }
  ], { duration: 440, delay: delay || 0, easing: 'cubic-bezier(.22,.85,.3,1.05)' });
}
// 亮牌：沿 Y 轴翻面
function flipIn(el, delay){
  anim(el, [
    { transform: 'rotateY(-92deg) scale(.9)', opacity: .25 },
    { transform: 'rotateY(0deg) scale(1)', opacity: 1 }
  ], { duration: 420, delay: delay || 0, easing: 'cubic-bezier(.3,.9,.35,1)' });
}
// 公共牌：从桌心飞来 + 3D 翻转
function dealFlip(el, delay){
  if (!el || reduceMotion) return;
  const r = el.getBoundingClientRect(), w = $('table-wrap').getBoundingClientRect();
  const dx = (w.left + w.width / 2) - (r.left + r.width / 2);
  const dy = (w.top + w.height / 2) - (r.top + r.height / 2);
  anim(el, [
    { transform: `translate(${dx}px,${dy}px) rotateY(-92deg) scale(.82)`, opacity: 0 },
    { transform: `translate(${dx * .35}px,${dy * .35}px) rotateY(-64deg) scale(.94)`, opacity: 1, offset: .52 },
    { transform: 'rotateY(0deg) scale(1)', opacity: 1 }
  ], { duration: 540, delay: delay || 0, easing: 'cubic-bezier(.3,.9,.35,1)' });
}
// 一叠筹码从 A 飞到 B（from/to 为相对桌面的中心点）
function flyChips(from, to, opts){
  if (!from || !to || reduceMotion) return;
  const o = opts || {};
  const el = document.createElement('div');
  el.className = 'chipfly';
  el.style.left = from.x + 'px';
  el.style.top = from.y + 'px';
  $('table-wrap').appendChild(el);
  const dx = to.x - from.x, dy = to.y - from.y;
  const a = anim(el, [
    { transform: 'translate(-50%,-50%) scale(.45)', opacity: 0 },
    { transform: `translate(calc(-50% + ${dx * .5}px),calc(-50% + ${dy * .5 - 16}px)) scale(1.06)`, opacity: 1, offset: .55 },
    { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.7)`, opacity: 0 }
  ], { duration: o.duration || 460, delay: o.delay || 0, easing: 'cubic-bezier(.35,.05,.4,1)' });
  const done = () => el.remove();
  if (a) a.onfinish = done; else done();
}
// all-in：全屏泛红 + 桌面震动
function allInFlash(){
  anim($('allin-flash'), [
    { opacity: 0 }, { opacity: .85, offset: .12 }, { opacity: 0 }
  ], { duration: 640, easing: 'ease-out' });
  anim($('table-wrap'), [
    { transform: 'translate(0,0)' },
    { transform: 'translate(-7px,4px)', offset: .14 },
    { transform: 'translate(6px,-4px)', offset: .3 },
    { transform: 'translate(-4px,3px)', offset: .48 },
    { transform: 'translate(3px,-2px)', offset: .64 },
    { transform: 'translate(0,0)' }
  ], { duration: 460, easing: 'cubic-bezier(.3,.7,.4,1)' });
}
// 赢家收池：底池处飞出一叠筹码，落点弹出 "+N"
function collectFx(id, amount){
  const v = seatViews.get(id);
  if (!v) return;
  const from = relCenter($('community'));
  const to = relCenter(v.plaque);
  if (!from || !to) return;
  flyChips(from, to, { delay: 120, duration: 560 });
  if (reduceMotion) return;
  // 起飞后落点再显示金额，视觉上像是"钱到账"
  setTimeout(() => {
    const tag = document.createElement('div');
    tag.className = 'won-tag';
    tag.textContent = '+' + fmt(amount);
    tag.style.left = to.x + 'px';
    tag.style.top = (to.y - 34) + 'px';
    $('table-wrap').appendChild(tag);
    anim(tag, [
      { transform: 'translate(-50%,-50%) scale(.6) translateY(8px)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.1) translateY(-6px)', opacity: 1, offset: .55 },
      { transform: 'translate(-50%,-50%) scale(1) translateY(-18px)', opacity: 0 }
    ], { duration: 1100, easing: 'ease-out' });
    setTimeout(() => tag.remove(), 1200);
  }, 560);
}

/* ================= 座位节点复用（方向1）================= */
// 每个座位只创建一次，之后只改变化的子节点
function makeSeatView(p){
  const el = document.createElement('div');
  el.className = 'seat';
  el.dataset.pid = p.id;

  const plaque = document.createElement('div');
  plaque.className = 'plaque';
  const avatar = avatarEl(p.name);
  const body = document.createElement('div');
  body.className = 'p-body';
  const nameEl = document.createElement('div');
  nameEl.className = 'p-name';
  const chipsEl = document.createElement('div');
  chipsEl.className = 'p-chips';
  const timer = document.createElement('div');
  timer.className = 'p-timer hidden';
  const timerFill = document.createElement('i');
  timer.appendChild(timerFill);
  body.append(nameEl, chipsEl, timer);
  plaque.append(avatar, body);

  const bubble = document.createElement('div');
  bubble.className = 'bubble hidden';

  const hole = document.createElement('div');
  hole.className = 'hole hidden';

  el.append(plaque, bubble, hole);
  // 计时条：只有百分比/低电量状态真的变化时才写样式
  let timerPct = -1, timerLow = null;
  const setTimer = (pct, left) => {
    const rounded = Math.round(pct);
    if (rounded !== timerPct){
      timerPct = rounded;
      timerFill.style.transform = `scaleX(${rounded / 100})`;
    }
    const low = left < 8000;
    if (low !== timerLow){ timerLow = low; timer.classList.toggle('low', low); }
  };
  return { el, plaque, avatar, nameEl, chipsEl, timer, bubble, hole, setTimer,
           holeKey: '', cards: [], sig: {}, lastBet: 0, lastBetRect: null,
           lastAllIn: !!p.allIn };
}

function syncSeats(s){
  const wrap = $('table-wrap');
  const n = s.players.length;

  // 结算时把赢家座位也点亮，不只是弹层里写个名字
  const wonIds = new Set();
  if (s.phase === 'showdown' && s.result && Array.isArray(s.result.pots)){
    s.result.pots.forEach(pot => (pot.winners || []).forEach(w => wonIds.add(w.id)));
  }

  const seen = new Set();
  s.players.forEach((p, i) => {
    seen.add(p.id);
    let v = seatViews.get(p.id);
    if (!v){
      v = makeSeatView(p);
      seatViews.set(p.id, v);
      wrap.appendChild(v.el);
    }
    const pos = seatPos(i, n);
    const isCur = i === s.currentPlayerIndex && live(s);

    // 位置：left/top 带 CSS 过渡，进人/走后座位是平滑挪动而不是瞬移
    const left = `clamp(78px, ${pos.x}%, calc(100% - 78px))`;
    const top = `clamp(58px, ${pos.y}%, calc(100% - 58px))`;
    if (v.el.style.left !== left) v.el.style.left = left;
    if (v.el.style.top !== top) v.el.style.top = top;

    // 状态类：整串比较，没变就不动 class，避免呼吸动画被反复重启
    const cls = 'seat' + (pos.top ? ' top' : '') +
      (p.folded || !p.inHand ? ' folded' : '') + (isCur ? ' current' : '') +
      (wonIds.has(p.id) ? ' winner' : '');
    if (v.el.className !== cls) v.el.className = cls;

    // 名牌：昵称 / 庄家 / 全下 / 断线 / 筹码
    let tags = '';
    if (i === s.dealerIndex) tags += '<span class="tag dealer">D</span>';
    if (p.allIn) tags += '<span class="tag allin">全下</span>';
    if (!p.connected) tags += '<span class="tag disc">断线</span>';
    else if (p.sittingOut) tags += '<span class="tag out">暂离</span>';
    if (!p.inHand && live(s)) tags += '<span class="tag wait">下局</span>';
    const nameKey = (p.id === s.hostId ? 'H' : '-') + '|' + (i === s.myIndex ? 'M' : '-') + '|' + p.name + '|' + tags;
    if (v.sig.name !== nameKey){
      v.sig.name = nameKey;
      v.nameEl.title = p.name;   // 长昵称被 CSS 截断，悬停看全名
      v.nameEl.innerHTML = `${p.id === s.hostId ? '👑' : ''}${escapeHtml(p.name)}` +
        `${i === s.myIndex ? ' <span style="opacity:.5;font-size:10px">(你)</span>' : ''}${tags}`;
    }
    const chipsKey = String(p.chips);
    if (v.sig.chips !== chipsKey){
      v.sig.chips = chipsKey;
      v.chipsEl.textContent = `筹码 ${fmt(p.chips)}`;
    }

    // 计时条（宽度由 tick() 每 250ms 更新，这里只负责显隐）
    v.timer.classList.toggle('hidden', !(isCur && s.turnDeadline));

    // 本街动作气泡
    const act = (p.lastAction && live(s)) ? (ACTION_NAME[p.lastAction] || p.lastAction) : '';
    if (v.sig.act !== act){
      v.sig.act = act;
      v.bubble.classList.toggle('hidden', !act);
      if (act){
        v.bubble.textContent = act;
        anim(v.bubble, [
          { transform: 'translateX(-50%) scale(.6)', opacity: 0 },
          { transform: 'translateX(-50%) scale(1.12)', opacity: 1, offset: .7 },
          { transform: 'translateX(-50%) scale(1)', opacity: 1 }
        ], { duration: 240, easing: 'ease-out' });
      }
    }

    // 别人的手牌：牌背；摊牌时亮出（弃牌的人不再显示，避免结算时又冒出牌背）
    const showHole = i !== s.myIndex && p.hand.length > 0 &&
      (!p.folded || p.hand.some(Boolean));
    const holeCards = showHole ? p.hand : [];
    const holeKey = holeCards.map(c => (c ? c.rank + c.suit : 'x')).join(',');
    if (v.holeKey !== holeKey){
      const prevKey = v.holeKey;
      v.holeKey = holeKey;
      v.hole.classList.toggle('hidden', holeCards.length === 0);
      v.hole.classList.toggle('shown', holeCards.some(Boolean));
      v.hole.textContent = '';
      v.cards = holeCards.map(c => {
        const el = cardEl(c, 'c-sm');
        v.hole.appendChild(el);
        return el;
      });
      // 牌背首次出现 = 发牌（从桌心飞过去）；由牌背变明牌 = 摊牌（原地翻面）
      const reveal = holeCards.some(Boolean) && !!prevKey && prevKey !== holeKey;
      v.cards.forEach((el, k) => reveal ? flipIn(el, k * 70) : flyFromCenter(el, 90 + k * 90));
    }

    // 下注筹码：节点复用，值变了才改文字，下注/加注才播飞行
    let betEl = betViews.get(p.id);
    if (!betEl){
      betEl = document.createElement('div');
      betEl.className = 'bet hidden';
      wrap.appendChild(betEl);
      betViews.set(p.id, betEl);
    }
    const hasBet = p.bet > 0;
    if (hasBet){
      const bl = (pos.x + (50 - pos.x) * 0.34) + '%';
      const bt = (pos.y + (50 - pos.y) * 0.30) + '%';
      if (betEl.style.left !== bl) betEl.style.left = bl;
      if (betEl.style.top !== bt) betEl.style.top = bt;
      const txt = fmt(p.bet);
      if (betEl.textContent !== txt) betEl.textContent = txt;
      betEl.classList.remove('hidden');
      v.lastBetRect = relCenter(betEl);
      if (p.bet > (v.lastBet || 0)){
        flyChips(relCenter(v.plaque), v.lastBetRect, { delay: 50 });
        anim(betEl, [
          { transform: 'translate(-50%,-50%) scale(.62)', opacity: .3 },
          { transform: 'translate(-50%,-50%) scale(1.1)', opacity: 1, offset: .7 },
          { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }
        ], { duration: 260, easing: 'ease-out' });
      }
    } else {
      betEl.classList.add('hidden');
      // 本街结束：注区筹码被收进底池（syncPot 里统一飞向底池中心）
      if (v.lastBet > 0 && v.lastBetRect) pendingPotFlights.push(v.lastBetRect);
    }
    v.lastBet = p.bet;

    // all-in 全屏反馈（同一局同一玩家只播一次）
    const allInKey = s.handNumber + ':' + p.id;
    if (p.allIn && !allInFxSeen.has(allInKey)){
      allInFxSeen.add(allInKey);
      if (!v.lastAllIn) allInFlash();
    }
    v.lastAllIn = p.allIn;
  });

  // 已经不在桌上的人：连座位带筹码一起回收
  seatViews.forEach((v, id) => {
    if (seen.has(id)) return;
    v.el.remove();
    seatViews.delete(id);
    const b = betViews.get(id);
    if (b){ b.remove(); betViews.delete(id); }
  });
}

/* ================= 公共牌 / 底池 / 手牌 / 底部信息 ================= */
// 5 个格子常驻，翻出的牌只在"出现"时播一次飞入+翻转
function syncBoard(s){
  const board = $('board');
  if (!boardCells){
    boardCells = [];
    board.textContent = '';
    for (let i = 0; i < 5; i++){
      const cell = document.createElement('div');
      cell.className = 'bcell';
      const slot = document.createElement('div');
      slot.className = 'slot md';
      cell.appendChild(slot);
      board.appendChild(cell);
      boardCells.push({ cell, slot, card: null, key: '' });
    }
  }
  const cards = s.communityCards || [];
  let newIdx = 0;
  boardCells.forEach((c, i) => {
    const want = i < cards.length ? cards[i] : null;
    const key = want ? want.rank + want.suit : '';
    if (c.key === key) return;
    c.key = key;
    if (c.card){ c.card.remove(); c.card = null; }
    if (want){
      const el = cardEl(want, 'c-md');
      c.cell.appendChild(el);
      c.card = el;
      c.slot.classList.add('hidden');
      dealFlip(el, newIdx++ * 90);
    } else {
      c.slot.classList.remove('hidden');
    }
  });
}

// 底池：数字滚动 + 本街筹码飞入
function syncPot(s){
  const el = $('pot');
  const center = relCenter($('community'));
  if (pendingPotFlights.length){
    pendingPotFlights.forEach((from, k) => flyChips(from, center, { delay: k * 45 }));
    pendingPotFlights.length = 0;
  }
  // 结算时服务端已把下注清零（pot 归零），这里用 result 里的池总额撑住显示，
  // 否则底池会在摊牌瞬间跳到 0，赢家收池动画就没有"钱从池里出去"的观感
  let target = Math.max(0, s.pot || 0);
  if (s.phase === 'showdown' && s.result && Array.isArray(s.result.pots)){
    const total = s.result.pots.reduce((sum, pot) => sum + (pot.amount || 0), 0);
    if (total > 0) target = total;
  }
  if (target === shownPot){
    if (target === 0 && el.textContent) el.textContent = '';
    return;
  }
  const from = shownPot;
  shownPot = target;
  cancelAnimationFrame(potRaf);
  if (reduceMotion){
    el.textContent = target > 0 ? `底池 ${fmt(target)}` : '';
    return;
  }
  const t0 = performance.now(), dur = 420;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const v = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = v > 0 ? `底池 ${fmt(v)}` : '';
    if (k < 1) potRaf = requestAnimationFrame(step);
  };
  potRaf = requestAnimationFrame(step);
  if (target > from){
    anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: .4 }, { transform: 'scale(1)' }],
      { duration: 360, easing: 'ease-out' });
  }
}

// 我的手牌：只有换局/换牌才重建，重建时从桌心飞下来
function syncMyCards(s){
  const mc = $('my-cards');
  const m = me();
  const cards = (m && m.hand) || [];
  const key = s.handNumber + '|' + cards.map(c => (c ? c.rank + c.suit : 'x')).join(',');
  if (myCardsKey === key) return;
  myCardsKey = key;
  mc.textContent = '';
  const els = cards.map(c => {
    const el = cardEl(c, 'c-lg');
    mc.appendChild(el);
    return el;
  });
  els.forEach((el, k) => flyFromCenter(el, k * 110));
}

// 底部"我"的信息：头像/昵称/筹码复用节点
function syncMeInfo(s){
  const mi = $('me-info'), m = me();
  if (!m){
    if (mi.childNodes.length){ mi.textContent = ''; meInfoEls = null; }
    return;
  }
  if (!meInfoEls){
    mi.textContent = '';
    const av = avatarEl(m.name);
    const txt = document.createElement('div');
    txt.className = 'txt';
    const nm = document.createElement('span');
    nm.className = 'nm';
    const cips = document.createElement('span');
    cips.className = 'cips';
    // 当前牌型提示：翻牌前就能看到「一对 A / 高牌 K」，翻牌后随公共牌更新
    const hand = document.createElement('span');
    hand.className = 'myhand hidden';
    txt.append(nm, cips, hand);
    mi.append(av, txt);
    meInfoEls = { av, nm, cips, handEl: hand, name: '', chips: null, hand: null };
  }
  if (meInfoEls.name !== m.name){
    meInfoEls.name = m.name;
    const fresh = avatarEl(m.name);
    meInfoEls.av.replaceWith(fresh);
    meInfoEls.av = fresh;
    meInfoEls.nm.textContent = m.name;
  }
  if (meInfoEls.chips !== m.chips){
    meInfoEls.chips = m.chips;
    meInfoEls.cips.textContent = `筹码 ${fmt(m.chips)}`;
  }
  const handText = s.currentHand || '';
  if (meInfoEls.hand !== handText){
    meInfoEls.hand = handText;
    meInfoEls.handEl.textContent = handText ? `当前 ${handText}` : '';
    meInfoEls.handEl.classList.toggle('hidden', !handText);
  }
}

// 赢家收池：每局只播一次
function syncShowdownFx(s){
  if (s.phase !== 'showdown' || !s.result || showdownFxHand === s.handNumber) return;
  showdownFxHand = s.handNumber;
  const won = new Map();
  (s.result.pots || []).forEach(pot => (pot.winners || []).forEach(w => {
    won.set(w.id, (won.get(w.id) || 0) + w.amount);
  }));
  if (!won.size) return;
  won.forEach((amount, id) => collectFx(id, amount));
}

function renderGame(){
  const s = state;
  $('g-room').textContent = s.roomId;
  $('g-blind').textContent = `${s.smallBlind}/${s.bigBlind}`;
  $('g-hand').textContent = s.handNumber > 0 ? `第 ${s.handNumber} 局` : '';
  $('g-phase').textContent = PHASE_NAME[s.phase] || s.phase;

  // 换局：清掉上一局的一次性动效记录
  if (s.handNumber !== dealtHandNo){
    dealtHandNo = s.handNumber;
    allInFxSeen.clear();
  }
  pendingPotFlights = [];

  // 增量更新：座位 → 公共牌 → 底池（消耗本节筹码飞行）→ 手牌 → 底部信息
  syncSeats(s);
  syncBoard(s);
  syncPot(s);
  syncMyCards(s);
  syncMeInfo(s);
  syncShowdownFx(s);

  renderBanner();
  renderActions();
  renderShowdown();
  tick();
}

function renderBanner(){
  const s = state, m = me(), bn = $('banner');
  bn.innerHTML = '';
  if (!m) return;
  const add = (text, btnText, fn) => {
    const span = document.createElement('span'); span.textContent = text; bn.appendChild(span);
    if (btnText){ const b = button(btnText, 'gold', fn); b.className = 'btn gold'; bn.appendChild(b); }
  };
  if (m.sittingOut) add('你已被设为暂离（超时未操作），下一局不会给你发牌', '回到座位', () => send('sitIn'));
  else if (m.chips === 0 && !(m.inHand && !m.folded && live(s))) add('你的筹码已输光', `补充 ${fmt(s.startingChips)} 筹码`, () => send('rebuy'));
  else if (!m.inHand && live(s)) add('本局进行中，你将在下一局加入');
}

/* ---------- 行动区 ---------- */
function renderActions(){
  const s = state, m = me();
  const bar = $('bottom-bar'), status = $('turn-status'), actions = $('actions');
  const L = s.legal;
  const myTurn = !!L;
  bar.classList.toggle('my-turn', myTurn);
  actions.innerHTML = '';
  uiActions = null;

  if (!myTurn){
    status.classList.remove('my');
    turnSecsEl = null;
    if (s.phase === 'showdown') status.textContent = '本局结束';
    else {
      const cur = s.players[s.currentPlayerIndex];
      status.innerHTML = cur ? `等待 ${escapeHtml(cur.name)} 行动 <span data-secs></span>` : '';
      turnSecsEl = status.querySelector('[data-secs]');
    }
    return;
  }

  status.innerHTML = '轮到你行动 <span data-secs></span>';
  turnSecsEl = status.querySelector('[data-secs]');
  status.classList.add('my');

  const { minRaiseTo: minTo, maxRaiseTo: maxTo } = L;

  const foldBtn = button('弃牌', 'red', () => act('fold'));
  foldBtn.title = '弃牌（F）';
  const callBtn = button(L.canCheck ? '过牌' : (L.toCall >= m.chips ? `全下跟注 ${fmt(m.chips)}` : `跟注 ${fmt(L.toCall)}`), 'teal',
    () => act(L.canCheck ? 'check' : 'call'));
  callBtn.title = (L.canCheck ? '过牌' : '跟注') + '（C）';
  actions.append(foldBtn, callBtn);
  actions.querySelectorAll('.btn').forEach(b => b.style.padding = '');

  // 键盘快捷键用的动作句柄（没有加注权时只有弃牌/跟注）
  uiActions = {
    fold: () => act('fold'),
    call: () => act(L.canCheck ? 'check' : 'call')
  };

  if (!L.canRaise) return;

  // 加注组：金额均为"本街加注到"的总额
  const box = document.createElement('div');
  box.id = 'raise-box';
  const step = Math.max(1, Math.round(s.smallBlind));
  const slider = document.createElement('input');
  slider.id = 'raise-slider'; slider.type = 'range';
  slider.min = minTo; slider.max = maxTo; slider.step = step;
  slider.setAttribute('aria-label', '加注金额');

  // 数字输入框：滑杆适合粗调，精确额度还得能敲（原来只能拖）
  const num = document.createElement('input');
  num.id = 'raise-input'; num.type = 'number'; num.inputMode = 'numeric';
  num.min = minTo; num.max = maxTo; num.step = step;
  num.setAttribute('aria-label', '加注金额（可直接输入）');

  const val = document.createElement('span'); val.id = 'raise-val';
  const btn = document.createElement('button');
  btn.className = 'btn gold'; btn.style.padding = '9px 16px';
  btn.title = '确认加注（Enter）';

  const turnKey = s.handNumber + ':' + s.phase + ':' + s.currentBet;
  let to = lastRaiseTo;
  if (to === null || turnKey !== lastTurnKey || to < minTo || to > maxTo) to = minTo;
  lastTurnKey = turnKey;

  // 夹到 [minTo, maxTo] 并按小盲取整；接近上限就直接算全下
  function clampTo(v){
    if (!Number.isFinite(v)) return to;
    if (v >= maxTo) return maxTo;
    const snapped = Math.round(v / step) * step;
    return Math.min(maxTo, Math.max(minTo, snapped));
  }
  function paint(){
    slider.value = to;
    if (document.activeElement !== num) num.value = to;
    const allin = to >= maxTo;
    val.textContent = (allin ? '全下 ' : '') + fmt(to);
    btn.textContent = allin ? `全下 ${fmt(maxTo)}` : (s.currentBet > 0 ? `加注到 ${fmt(to)}` : `下注 ${fmt(to)}`);
    slider.setAttribute('aria-valuetext', (allin ? '全下 ' : '') + fmt(to));
    num.setAttribute('aria-valuetext', (allin ? '全下 ' : '') + fmt(to));
  }
  function commit(){
    lastRaiseTo = null;
    if (to >= maxTo) act('all-in'); else act('raise', to);
  }
  slider.oninput = () => {
    to = clampTo(Number(slider.value));
    lastRaiseTo = to; paint();
  };
  btn.onclick = commit;
  num.addEventListener('input', () => {
    // 输入过程中不打断用户：只同步内部值，提交/失焦时再归位
    const v = Number(num.value);
    if (num.value === '' || !Number.isFinite(v)) return;
    to = clampTo(v);
    lastRaiseTo = to;
    slider.value = to;
    paint();                      // 同步金额文案，否则输入了 300 按钮还显示 200
  });
  num.addEventListener('change', () => { num.value = to; });
  num.addEventListener('blur', () => { num.value = to; });
  num.addEventListener('keydown', e => {
    e.stopPropagation();          // 别让全局快捷键抢走输入
    if (e.key === 'Enter'){ num.value = to; commit(); }
    else if (e.key === 'Escape'){ num.value = to; num.blur(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      e.preventDefault();
      to = clampTo(to + (e.key === 'ArrowUp' ? step : -step));
      lastRaiseTo = to; paint();
    }
  });

  const potAfterCall = s.pot + L.toCall;
  const quick = document.createElement('div'); quick.id = 'quick-row';
  [['最小', () => minTo],
   ['½池', () => s.currentBet + Math.round(potAfterCall / 2)],
   ['满池', () => s.currentBet + potAfterCall],
   ['全下', () => maxTo]].forEach(([label, f]) => {
    const q = document.createElement('button');
    q.className = 'btn'; q.textContent = label;
    q.onclick = () => {
      to = clampTo(f());
      lastRaiseTo = to; paint();
    };
    quick.appendChild(q);
  });

  box.appendChild(slider); box.appendChild(num); box.appendChild(val);
  box.appendChild(quick); box.appendChild(btn);
  actions.appendChild(box);
  paint();

  uiActions.raise = commit;
  uiActions.focusRaise = () => { num.focus(); num.select(); };
  uiActions.nudge = dir => {
    to = clampTo(to + dir * step);
    lastRaiseTo = to; paint();
  };
}
let acting = false;
let uiActions = null;   // 当前轮次可用的行动句柄，供键盘快捷键调用（不在轮次内则为 null）

// 键盘操作：F 弃牌 / C 过牌或跟注 / R 聚焦加注输入 / ←→ 微调 / Enter 确认
document.addEventListener('keydown', e => {
  if (!uiActions || confirmBarEl) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'f'){ e.preventDefault(); uiActions.fold(); }
  else if (k === 'c'){ e.preventDefault(); uiActions.call(); }
  else if (k === 'r'){ if (!uiActions.focusRaise) return; e.preventDefault(); uiActions.focusRaise(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight'){
    if (!uiActions.nudge) return;
    e.preventDefault();
    uiActions.nudge(k === 'ArrowRight' ? 1 : -1);
  } else if (k === 'Enter' && uiActions.raise){ e.preventDefault(); uiActions.raise(); }
});

async function act(action, amount){
  if (acting) return;          // 防止连点
  acting = true;
  lastRaiseTo = null;
  try {
    const res = await send('playerAction', { action, amount });
    if (!res.success) renderActions();  // 失败（超时/被拒）后按最新状态重画按钮
  } finally {
    acting = false;
  }
}

/* ---------- 结算 ---------- */
function renderShowdown(){
  const s = state, box = $('showdown');
  if (s.phase !== 'showdown' || !s.result || sdHiddenFor === s.handNumber){
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  const r = s.result;
  $('sd-title').textContent = `第 ${s.handNumber} 局 · ${r.uncontested ? '结算' : '摊牌'}`;

  const won = {};
  r.pots.forEach(pot => pot.winners.forEach(w => { won[w.id] = (won[w.id] || 0) + w.amount; }));

  const pots = $('sd-pots'); pots.innerHTML = '';
  r.pots.forEach((pot, i) => {
    const row = document.createElement('div');
    row.className = 'pot-row';
    const label = r.pots.length === 1 ? '底池' : i === 0 ? '主池' : `边池 ${i}`;
    row.innerHTML = `${label} <b>${fmt(pot.amount)}</b> → ` +
      pot.winners.map(w => `${escapeHtml(w.name)}${pot.winners.length > 1 ? ` (${fmt(w.amount)})` : ''}`).join('、');
    pots.appendChild(row);
  });

  const hands = $('sd-hands'); hands.innerHTML = '';
  if (r.uncontested){
    const w = r.pots[0].winners[0];
    const row = document.createElement('div');
    row.className = 'sd-hand';
    row.innerHTML = `<div class="who">${escapeHtml(w.name)}<span class="desc">其他玩家均已弃牌</span><span class="won">+${fmt(w.amount)}</span></div>`;
    hands.appendChild(row);
  }
  // 赢家排前面
  const sorted = [...r.hands].sort((a, b) => (won[b.id] || 0) - (won[a.id] || 0));
  sorted.forEach(h => {
    const row = document.createElement('div');
    row.className = 'sd-hand';
    row.innerHTML = `<div class="who">${escapeHtml(h.name)}<span class="desc">${escapeHtml(h.description)}</span>` +
      (won[h.id] ? `<span class="won">+${fmt(won[h.id])}</span>` : '') + '</div>';
    const cards = document.createElement('div');
    cards.className = 'cards';
    const addCard = c => {
      const el = cardEl(c, 'c-xs');
      el.classList.add(h.best.some(b => sameCard(b, c)) ? 'hl' : 'dim');
      cards.appendChild(el);
    };
    h.cards.forEach(addCard);
    const gap = document.createElement('span'); gap.className = 'gap'; cards.appendChild(gap);
    s.communityCards.forEach(addCard);
    row.appendChild(cards);
    hands.appendChild(row);
  });

  const btns = $('sd-btns'); btns.innerHTML = '';
  if (iAmController()) btns.appendChild(button('立即开始下一局', 'gold', () => send('nextHand')));
  const m = me();
  if (m && m.chips === 0) btns.appendChild(button(`补充筹码 ${fmt(s.startingChips)}`, 'teal', () => send('rebuy')));
  if (m && m.sittingOut) btns.appendChild(button('回到座位', 'teal', () => send('sitIn')));
  btns.appendChild(button('查看牌桌', 'ghost', hideShowdown));
}

// 结算层之前只能点一个小按钮关掉：补上点空白处和 Esc
function hideShowdown(){
  if (state) sdHiddenFor = state.handNumber;
  $('showdown').classList.add('hidden');
}
$('showdown').addEventListener('click', e => {
  if (e.target === $('showdown')) hideShowdown();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (confirmBarEl) return closeConfirmBar();
  if (!$('showdown').classList.contains('hidden')) hideShowdown();
});

/* ---------- 倒计时 ---------- */
// 只在数值真的变化时才写 DOM；计时条用 transform 缩放，避免每 250ms 触发重排。
// 之前是每次全文档 querySelectorAll 两遍，8 人桌每秒要扫 16 次。
let turnSecsEl = null;      // 行动区的 "· Ns"，renderActions 重建时更新
const sdCountEl = $('sd-count');
function tick(){
  if (!state) return;
  const s = state;
  if (live(s) && s.turnDeadline){
    const left = Math.max(0, s.turnDeadline - serverNow());
    const total = Math.max(1, s.turnDeadline - s.serverNow);
    const secs = Math.ceil(left / 1000);
    const txt = `· ${secs}s`;
    if (turnSecsEl && turnSecsEl.textContent !== txt) turnSecsEl.textContent = txt;
    const pct = Math.max(0, Math.min(100, 100 * left / total));
    seatViews.forEach(v => v.setTimer(pct, left));
  }
  if (s.phase === 'showdown' && s.nextHandAt){
    const secs = Math.max(0, Math.ceil((s.nextHandAt - serverNow()) / 1000));
    const txt = `${secs} 秒后自动开始下一局`;
    if (sdCountEl && sdCountEl.textContent !== txt) sdCountEl.textContent = txt;
  }
}
// 页面不可见时不跑计时器（移动端省电，回来立刻补一帧）
let tickTimer = 0;
function startTicker(){
  if (tickTimer) return;
  tickTimer = setInterval(tick, 250);
}
function stopTicker(){
  clearInterval(tickTimer);
  tickTimer = 0;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopTicker();
  else { startTicker(); tick(); }
});
startTicker();

/* ---------- 连接 ---------- */
socket.on('connect', async () => {
  $('reconnecting').classList.add('hidden');
  const sess = loadSession();
  if (!sess) { if (!state) showScreen('lobby-screen'); return; }
  const res = await new Promise(r => socket.emit('resume', sess, r));
  if (!res || !res.success){
    saveSession(null);
    state = null;
    $('showdown').classList.add('hidden');
    showScreen('lobby-screen');
    if (sess.roomId) {
      $('room-input').value = sess.roomId;
      showJoinPanel(false);
      toast((res && res.error) || '无法回到房间');
    }
  }
});
socket.on('disconnect', () => $('reconnecting').classList.remove('hidden'));
socket.on('kicked', ({ reason }) => {
  socket.disconnect();
  $('reconnecting').classList.add('hidden');
  $('conn-lost-msg').textContent = '⚠ ' + (reason || '连接已断开');
  $('conn-lost').classList.remove('hidden');
});

renderName();
</script>
